# DeepSearch Configuration Template
# 使用环境变量覆盖配置：使用双下划线分隔
# 例如：LOG__LEVEL=DEBUG 覆盖 log.level

app:
  name: DeepSearch
  env: ${ENV:dev}  # dev | prod
  debug: ${DEBUG:false}  # 生产环境必须为false
  author: BaHb

runtime:
  mode: full

log:
  level: ${LOG_LEVEL:INFO}  # DEBUG | INFO | WARNING | ERROR
  format: ${LOG_FORMAT:verbose}  # verbose (dev) | json (prod)
  toFile: true
  toConsole: true
  active: true
  rotation: "00:00"
  retention_days: ${LOG_RETENTION_DAYS:30}  # 建议生产环境至少30天
  enable_json: ${LOG_JSON:false}  # 生产环境建议开启

database:
  main:
    type: postgresql
    host: ${DB_HOST:localhost}
    port: ${DB_PORT:5432}
    database: ${DB_NAME:deepsearch}
    username: ${DB_USER:deepsearch_user}
    password: ${DB_PASSWORD}  # 必须通过环境变量设置
    # 连接池配置
    pool:
      min_size: ${DB_POOL_MIN:5}
      max_size: ${DB_POOL_MAX:20}
      max_overflow: ${DB_POOL_OVERFLOW:10}
      pool_timeout: ${DB_POOL_TIMEOUT:30}
      pool_recycle: ${DB_POOL_RECYCLE:3600}
    auto_connect: true
    enabled: true

  cache:
    enabled: ${REDIS_ENABLED:true}
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    username: "your_redis_username"
    password: ${REDIS_PASSWORD}  # 生产环境必须设置密码
    db: ${REDIS_DB:0}
    # 连接池配置
    pool_size: ${REDIS_POOL_SIZE:10}
    socket_timeout: ${REDIS_SOCKET_TIMEOUT:5}
    socket_connect_timeout: ${REDIS_CONNECT_TIMEOUT:5}
    socket_keepalive: true
    retry_on_timeout: true
    # 健康检查
    health_check_interval: 30
    max_idle_time: 300
    idle_check_interval: 60
    auto_start_windows: ${REDIS_AUTO_START_WINDOWS:true}
    windows_service_names:
      - ${REDIS_WINDOWS_SERVICE_PRIMARY:Redis}
      - ${REDIS_WINDOWS_SERVICE_FALLBACK:redis}
    startup_binary_path: ${REDIS_BINARY_PATH:C:/Program Files/Redis/redis-server.exe}
    startup_arguments: []
    startup_command: []  # 可选：例如 ['wsl.exe', '-d', 'Ubuntu', '-u', 'root', 'service', 'redis-server', 'start']
    wsl:
      enabled: 
      distro: 
      auto_resolve_ip: 
      service_name: redis-server  # 可选：WSL 中 service 命令对应的 Redis 服务名
      user: root  # 可选：执行命令时使用的 WSL 用户 (传递给 -u)

# 数据源统一配置
data_sources:
  default: amazingdata
  fallback_order:
    - amazingdata
    - cloudflare
    - akshare
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: 60
    half_open_attempts: 3
  failover:
    enabled: true
    timeout: 5
    retry_count: 3
    backoff_factor: 2
  providers:
    amazingdata:
      enabled: true
      priority: 1
      fallback_sources:
        - cloudflare
        - akshare
      has_saved_credential: false
      config:
        implementation_mode: process
        connection:
          username: your_amazingdata_username
          password: your_amazingdata_password
          host: 101.230.159.234
          port: 8600
          timeout: 10
          heartbeat_interval: 60
          auto_reconnect: true
          reconnect_interval: 10
          max_retries: 3
          network_provider: telecom
        subscription:
          enabled: true
          batch_size: 100
          max_symbols: 500
          auto_resubscribe: true
        cache:
          enabled: true
          ttl: 300
          max_size: 10000
    cloudflare:
      enabled: true
      priority: 2
      config:
        worker_url: https://your-cloudflare-worker.example.com
        timeout: 30
        retry_count: 3
        fallback_to_direct: true
    akshare:
      enabled: true
      priority: 3
      config:
        mode: proxy
        timeout: 30
        proxy:
          enabled: true
          worker_url: https://akshare-proxy.example.com
          timeout: 15
          retry_count: 3
          fallback_to_direct: true
          cache:
            enabled: true
            ttl: 300

message_bus:
  buses:
    inmem:
      type: inmem
      enabled: true
      config: {}
    zmq:
      type: zmq
      enabled: ${ZMQ_ENABLED:false}
      config:
        pub_port: ${ZMQ_PUB_PORT:5556}
        sub_port: ${ZMQ_SUB_PORT:5557}

  routes:
    - match: '*'
      buses:
        - inmem

# Web服务配置
webui:
  backend:
    host: ${WEBUI_HOST:0.0.0.0}
    port: ${WEBUI_PORT:8000}
    reload: ${WEBUI_RELOAD:false}  # 生产环境必须为false
    workers: ${WEBUI_WORKERS:4}
    cors:
      origins: ${CORS_ORIGINS:["*"]}  # 生产环境应限制具体域名

  frontend:
    port: ${FRONTEND_PORT:3000}
    proxy:
      target: ${FRONTEND_PROXY:http://localhost:8000}

# 监控配置
monitoring:
  enabled: ${MONITORING_ENABLED:true}
  metrics:
    export_interval: 60
    retention_period: 86400  # 24小时
  health:
    check_interval: 30
    endpoints:
      - /api/health
      - /api/status
  alerts:
    enabled: ${ALERTS_ENABLED:true}
    channels:
      - email
      - webhook
    thresholds:
      error_rate: 0.05  # 5%错误率告警
      response_time: 1000  # 1秒响应时间告警

# 性能优化配置
performance:
  cache:
    l1:  # 内存缓存
      enabled: true
      max_size: 1000
      ttl: 60
    l2:  # Redis缓存
      enabled: true
      ttl: 300
    l3:  # 数据库缓存
      enabled: false
      ttl: 3600

  request:
    deduplication: true  # 请求去重
    rate_limiting: true  # 速率限制
    batch_processing: true  # 批处理

  threading:
    max_workers: ${MAX_WORKERS:10}
    thread_pool_size: ${THREAD_POOL_SIZE:20}

# 安全配置
security:
  # API密钥管理
  api_keys:
    rotation_period: 90  # 90天轮换
    min_length: 32

  # 密码策略
  password:
    min_length: 12
    require_uppercase: true
    require_lowercase: true
    require_numbers: true
    require_special: true

  # 会话管理
  session:
    timeout: 3600  # 1小时
    max_concurrent: 5  # 最大并发会话

  # 审计日志
  audit:
    enabled: true
    log_sensitive_operations: true
    retention_days: 365
market_data:
  realtime:
    enabled: true
    boards: [ ]
    interval_seconds: 1.0
    request_timeout_seconds: 3.0
    capital_windows:
      - name: 1m
        duration_seconds: 60
    order_window:
      name: 1m
      duration_seconds: 60
    capital_limit: 50
    order_limit: 100
    redis:
      url: redis://localhost:6379/6
      strength_ttl: 180
      imbalance_ttl: 180
      auction_ttl: 180
      max_strength_entries: 50

