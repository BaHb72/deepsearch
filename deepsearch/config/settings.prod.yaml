app:
  appName: DeepSearch
  env: prod
  debug: true
  name: DeepSearch
  author: BaHb
log:
  level: INFO
  format: verbose
  toFile: true
  toConsole: true
  active: true
  rotation: 00:00
  retention_days: 7
  enable_json: false
database:
  main:
    type: postgresql
    host: localhost
    port: 5432
    database: deepsearch
    username: bahb
    password: '123456'
    path: ./data/deepsearch.db
    auto_connect: true
    enabled: true
    has_saved_password: false
  cache:
    enabled: true
    host: localhost
    port: 6379
    password: ''
    db: 0
    poolSize: 10
    pool_size: 10
    has_saved_password: false
  analytics: # DuckDB 分析数据库
    enabled: false
    path: ./data/analytics/market.duckdb
    memory_limit: 8GB  # 生产环境给更多内存
    threads: 8
    temp_directory: ./data/analytics/temp
    auto_sync: true
    sync_interval: 1800  # 30分钟同步一次

# ========================================
# Cloudflare 配置
# ========================================
cloudflare:
  # 支持多个 Worker URLs（优先使用）
  workers:
    - "https://akshare-proxy.934073514.workers.dev"
    # 可以添加更多 Worker 节点以实现负载均衡和故障转移
    # - "https://backup-worker.workers.dev"
  
  # 单个 Worker URL（向后兼容）
  worker_url: "https://akshare-proxy.934073514.workers.dev"

# ========================================
# QMT集成配置
# ========================================
qmt:
  enabled: true
  receiver:
    tcp_port: 9999
    websocket_port: 9998
    host: "0.0.0.0"
  security:
    enable_auth: true  # 生产环境启用认证
    token: "prod-secure-token-change-this"  # 请修改为安全的令牌
  data:
    batch_size: 100
    flush_interval: 0.1
    cache_ttl: 60  # 数据缓存时间（秒）
  monitoring:
    enabled: true
    report_interval: 30  # 状态报告间隔（秒）
  
  # Tunnel 配置
  tunnel_url: "${CLOUDFLARE_TUNNEL_URL:https://akshare-api.yourdomain.com}"
  
  # 通用配置
  timeout: 30
  retry_count: 3

# ========================================
# Cloudflare Workers 代理配置
# ========================================
cloudflare_workers:
  url: ""  # Worker URL，例如: your-worker.workers.dev
  api_key: ""  # 可选，与 Worker 的 API_KEY 一致
  fallback_to_direct: true  # Worker 不可用时是否回退到直连

# ========================================
# MiniQMT集成配置
# ========================================
miniqmt:
  enabled: true
  connection:
    host: "127.0.0.1"
    port: 7777
    username: ""
    password: ""
    timeout: 10
  data:
    symbols: [ ]  # 默认订阅的股票列表
    period: "1d"
    cache_ttl: 60
    batch_size: 100
  monitoring:
    enabled: true
    heartbeat_interval: 30
    report_interval: 60

# ========================================
# Cloudflare Workers 代理配置
# ========================================
cloudflare_workers:
  # 是否启用 Workers 代理
  enabled: false
  
  # Workers 域名
  url: "akshare-proxy.934073514.workers.dev"
  
  # 请求超时时间（秒）
  timeout: 30
  
  # 重试次数
  retry_count: 3
  
  # 重试延迟（秒）
  retry_delay: 1
  
  # API 密钥（可选）
  api_key: ""
  
  # Workers 失败时是否自动切换到直连
  # 启用直连作为备用方案
  fallback_to_direct: true
  
  # 缓存配置
  cache_enabled: true
  cache_ttl: 300  # 缓存过期时间（秒）
  secret_key: "${CLOUDFLARE_SECRET_KEY:}"

# ========================================
# 数据提供者配置
# ========================================
message_bus:
  buses:
    inmem:
      type: inmem
      enabled: true
      config: { }
  routes:
    - match: "*"
      buses: [ "inmem" ]

# ========================================
# 数据提供者配置
# ========================================
data_providers:
  # 默认提供者
  default: "cloudflare_proxy"
  
  # Cloudflare Worker 代理
  cloudflare_proxy:
    enabled: true
    worker_url: "https://akshare-proxy.934073514.workers.dev"
    timeout: 30
    retry_count: 3
    cache_ttl: 60
  
  # AkShare 代理配置
  akshare_proxy:
    enabled: false
    use_proxy: true
    cache_ttl: 300  # 5分钟本地缓存
    rate_limit:
      max_requests: 100
      time_window: 60
