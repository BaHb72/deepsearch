app:
  name: DeepSearch
  author: BaHb
  env: prod
  debug: false
  data_dir: ./data
runtime:
  mode: full
log:
  active: true
  level: INFO
  rotation: 00:00
  retention_days: 7
  enable_json: false
  archive:
    enabled: true
    format: zip
    archive_after_days: 7
    purge_after_days: 60
  modules:
    enabled: false
    directory: modules
    max_depth: 2
    rotation: 00:00
    retention_days: 7
database:
  main:
    enabled: true
    type: postgresql
    host: localhost
    port: 5432
    database: deepsearch
    username: postgres
    password: '123456'
    path: ./data/deepsearch.db
    auto_connect: true
    echo: false
  cache:
    enabled: true
    host: localhost
    port: 6379
    password: ''
    db: 0
    pool_size: 10
    socket_timeout: 5
    socket_connect_timeout: 5
    socket_keepalive: true
    retry_on_timeout: true
    health_check_interval: 30
    max_idle_time: 300
    idle_check_interval: 60
    auto_start_windows: true
    startup_command:
    - wsl.exe
    - -d
    - Ubuntu
    - -u
    - root
    - service
    - redis-server
    - start
    wsl:
      enabled: true
      distro: Ubuntu
      auto_resolve_ip: true
      service_name: redis-server
      user: root
message_bus:
  buses:
    inmem:
      type: inmem
      enabled: true
      config: { }
  routes:
  - match: '*'
    buses:
      - inmem
webui:
  enabled: true
  backend_host: 0.0.0.0
  backend_port: 8000
  frontend_enabled: true
  frontend_host: localhost
  frontend_port: 3000
  enable_cors: true
  reload: false
data_sources:
  default: miniqmt
  fallback_order:
    - miniqmt
  - akshare
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: 60
    half_open_attempts: 3
  failover:
    enabled: true
    timeout: 5
    retry_count: 3
    backoff_factor: 2
  providers:
    amazingdata:
      enabled: false
      priority: 1
      fallback_sources:
      - akshare
      has_saved_credential: true
      config:
        implementation_mode: process
        connection:
          username: 212200038719
          password: 212200038719@2025
          host: 101.230.159.234
          port: 8600
          timeout: 5000
          heartbeat_interval: 60
          auto_reconnect: true
          reconnect_interval: 10
          max_retries: 3
          network_provider: telecom
          python_interpreter_path: C:/Python313/python.exe
          tgw_log_path: C:/Galaxy/gateway/logs
        subscription:
          enabled: true
          batch_size: 100
          max_symbols: 500
          auto_resubscribe: true
        cache:
          enabled: true
          ttl: 300
          max_size: 10000
        monitoring:
          enabled: true
          report_interval: 60
          metrics_enabled: true
          log_slow_requests: true
          slow_request_threshold: 1000
          timeout: 5000
        username: demo_user
        password: demo_password
        host: 1.2.3.4
        port: 8600
        timeout: 5000
      timeout: 10.0
      retry_count: 3
      fallback_enabled: false
      provider_name: amazingdata
    akshare:
      enabled: true
      priority: 3
      config:
        mode: direct
        timeout: 30
        proxy:
          enabled: true
          worker_url: https://your-cloudflare-worker.example.com
          timeout: 30
          retry_count: 3
          fallback_to_direct: true
          cache:
            enabled: true
            ttl: 300
    miniqmt:
      enabled: true
      priority: 1
      config:
        host: localhost
        port: 58610
        timeout: 10
        cache:
          enabled: true
          ttl: 60
  realtime:
    health_check_interval: 120
    alert_policy:
      enabled: true
      failure_threshold: 3
      window_seconds: 300
      channels:
      - ops-bot
    adapters:
      - name: miniqmt
        driver: miniqmt
      priority: 1
      enabled: true
      health:
        probe_timeout_seconds: 5
        failure_threshold: 3
        cool_down_seconds: 30
          - name: amazingdata
            driver: amazingdata
      priority: 2
        enabled: false
        health:
          probe_timeout_seconds: 5
          failure_threshold: 3
          cool_down_seconds: 30
    - name: akshare
      driver: akshare_polling
      priority: 3
      enabled: false
      options:
        use_proxy: false
        batch_size: 50
data_source_prefetch:
  enabled: true
  interval_seconds: 300
  job_type: prefetch_stock_basics
  max_job_age_minutes: 45


market_data:
  realtime:
    enabled: true
    boards:
    - 主板
    - 创业板
    - 科创板
    - 北证
    include_markets:
    - SH_MAIN
    - SZ_MAIN
    - STAR
    - SZ_GEM
    - BSE
    - INDEX
    - ETF
    interval_seconds: 1.0
    request_timeout_seconds: 3.0
    initial_step_timeout_seconds: 12.0
    off_day_interval_seconds: 60.0
    no_trade_interval_seconds: 5.0
    auction_interval_seconds: 1.0
    continuous_interval_seconds: 1.0
    off_day_timeout_seconds: 0.5
    no_trade_timeout_seconds: 1.0
    auction_timeout_seconds: 2.0
    continuous_timeout_seconds: 3.5
    capital_windows:
    - name: 1m
      duration_seconds: 60
    - name: 5m
      duration_seconds: 300
    order_window:
      name: 1m
      duration_seconds: 60
    capital_limit: 50
    order_limit: 100
    redis:
      url: redis://localhost:6379/6
      strength_ttl: 180
      imbalance_ttl: 180
      auction_ttl: 180
      max_strength_entries: 50
  modules:
    strength:
      primary: miniqmt
      fallbacks:
        - source: akshare
          phases:
            - off_day
            - no_trade
          trigger_errors:
            - DATA_SOURCE_OFFLINE
            - SESSION_EXPIRED
          cache_ttl_seconds: 90
          min_interval_seconds: 15
    board_overview:
      primary: miniqmt
      fallbacks:
        - source: akshare
          phases:
            - off_day
          trigger_errors:
            - DATA_SOURCE_OFFLINE
          cache_ttl_seconds: 120
          min_interval_seconds: 30
    order_imbalance:
      primary: miniqmt
      fallbacks:
        - source: akshare
          phases:
            - off_day
            - no_trade
          trigger_errors:
            - DATA_SOURCE_OFFLINE
          cache_ttl_seconds: 60
          min_interval_seconds: 15
    auction_quality:
      primary: miniqmt
      fallbacks:
        - source: akshare
          phases:
            - auction
            - off_day
          trigger_errors:
            - DATA_SOURCE_OFFLINE
          cache_ttl_seconds: 45
          min_interval_seconds: 10
notifications:
  enabled: true
  wechat_token: unit-test-token
  bark_token: unit-test-token
  base_urls:
    wechat: https://wx.xtuis.cn
    bark: https://bark.xtuis.cn
  default_channel: wechat
  categories:
    alert:
      enabled: true
      max_per_window: 3
      window_seconds: 180
      channels:
      - wechat
    info:
      enabled: true
      max_per_window: 10
      window_seconds: 600
      channels:
      - wechat
      - bark
  request_timeout: 6.5
  retry_attempts: 2
  retry_delay: 1.0
  title_template: 测试默认标题 {symbol}
  body_template: 最新价格：{price}
