app:
  author: BaHb
  debug: false
  env: prod
  name: DeepSearch
data_sources:
  providers:
    akshare:
      enabled: true
      priority: 3
    amazingdata:
      enabled: false
      priority: 1
    cloudflare:
      enabled: true
      priority: 2
    qmt:
      enabled: false
      priority: 4
log:
  active: true
  format: json
  level: INFO
  toConsole: true
  toFile: true
logging:
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  level: INFO
  output: console
message_bus:
  buses:
    zmq:
      config:
        host: localhost
        pub_port: 5556
        sub_port: 5557
      type: zeromq
monitoring:
  enabled: true
  interval: 60
system:
  mode: production
  name: DeepSearch
  version: 0.1.0
webui:
  backend_port: 8000
  frontend_port: 3000
  host: 0.0.0.0
