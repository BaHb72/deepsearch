app:
  author: BaHb
  debug: false
  env: prod
  name: DeepSearch
data_sources:
  providers:
    akshare:
      enabled: false
      priority: 3
    amazingdata:
      enabled: true
      priority: 1
    cloudflare:
      enabled: false
      priority: 2
    qmt:
      enabled: false
      priority: 4
log:
  active: true
  format: json
  level: INFO
  toConsole: true
  toFile: true
message_bus:
  buses:
    zmq:
      config:
        host: localhost
        pub_port: 5556
        sub_port: 5557
      type: zmq
monitoring:
  enabled: true
  interval: 60
webui:
  backend_host: 0.0.0.0
  backend_port: 8000
  frontend_port: 3000
