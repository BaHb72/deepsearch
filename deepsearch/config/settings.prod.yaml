app:
  name: DeepSearch
  author: BaHb
  env: prod
  debug: false
  data_dir: ./data
runtime:
  mode: full
log:
  active: true
  level: INFO
  rotation: 00:00
  retention_days: 7
  enable_json: false
database:
  main:
    enabled: true
    type: postgresql
    host: localhost
    port: 5432
    database: deepsearch
    username: postgres
    password: '123456'
    path: ./data/deepsearch.db
    auto_connect: false
    echo: false
  cache:
    enabled: true
    host: localhost
    port: 6379
    password: updated-cache
    db: 0
    pool_size: 10
    socket_timeout: 5
    socket_connect_timeout: 5
    socket_keepalive: true
    retry_on_timeout: true
    health_check_interval: 30
    max_idle_time: 300
    idle_check_interval: 60
    auto_start_windows: true
    startup_command:
    - wsl.exe
    - -d
    - Ubuntu
    - -u
    - root
    - service
    - redis-server
    - start
    wsl:
      enabled: true
      distro: Ubuntu
      auto_resolve_ip: true
      service_name: redis-server
      user: root
message_bus:
  buses:
    zmq:
      type: zmq
      enabled: true
      config:
        host: localhost
        pub_port: 5556
        sub_port: 5557
  routes:
  - match: '*'
    buses:
    - zmq
webui:
  enabled: true
  backend_host: 0.0.0.0
  backend_port: 8000
  frontend_enabled: true
  frontend_host: localhost
  frontend_port: 3000
  enable_cors: true
  reload: false
data_sources:
  default: amazingdata
  fallback_order:
  - amazingdata
  - akshare
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    recovery_timeout: 60
    half_open_attempts: 3
  failover:
    enabled: true
    timeout: 5
    retry_count: 3
    backoff_factor: 2
    providers:
      amazingdata:
        enabled: false
        priority: 1
        fallback_sources:
        - akshare
        has_saved_credential: false
        config:
          implementation_mode: process
          username: your_amazingdata_username
          password: your_amazingdata_password
          host: 101.230.159.234
          port: 8600
          timeout: 10
          heartbeat_interval: 60
          auto_reconnect: true
          reconnect_interval: 10
          max_retries: 3
          network_provider: telecom
          tgw_log_path: C:/Galaxy/gateway/logs
          python_interpreter_path: runtime/interpreters/py39/Scripts/python.exe
        local:
          path: D:/AmazingData/cache
          use_local: false
        subscription:
          enabled: true
          batch_size: 100
          max_symbols: 500
          auto_resubscribe: true
        cache:
          enabled: true
          ttl: 300
          max_size: 10000
        monitoring:
          enabled: true
          report_interval: 60
          metrics_enabled: true
          log_slow_requests: true
          slow_request_threshold: 1000
          timeout: 5000
    akshare:
      enabled: true
      priority: 3
      config:
        mode: proxy
        timeout: 30
        proxy:
          worker_url: https://your-cloudflare-worker.example.com
          timeout: 30
          retry_count: 3
          fallback_to_direct: true
          cache:
            enabled: true
            ttl: 300
  providers:
    amazingdata:
      enabled: false
      priority: 1
      timeout: 10.0
      retry_count: 3
      fallback_enabled: true
      fallback_sources:
      - akshare
      config:
        host: 1.2.3.4
        timeout: 5000
        implementation_mode: process
        username: demo_user
        password: demo_password
        port: 8600
      has_saved_credential: true
      provider_name: amazingdata
    akshare:
      enabled: true
      priority: 2
      timeout: 30.0
      retry_count: 3
      fallback_enabled: false
      config:
        mode: proxy
        timeout: 30
        proxy:
          enabled: true
          worker_url: https://your-cloudflare-worker.example.com
          timeout: 30
          retry_count: 3
          fallback_to_direct: true
          cache:
            enabled: true
            ttl: 300
notifications:
  enabled: true
  wechat_token: unit-test-token
  bark_token: unit-test-token
  base_urls:
    wechat: https://wx.xtuis.cn
    bark: https://bark.xtuis.cn
  default_channel: wechat
  categories:
    alert:
      enabled: true
      max_per_window: 3
      window_seconds: 180
      channels:
      - wechat
    info:
      enabled: true
      max_per_window: 10
      window_seconds: 600
      channels:
      - wechat
      - bark
  request_timeout: 6.5
  retry_attempts: 2
  retry_delay: 1.0
  title_template: 测试默认标题 {symbol}
  body_template: 最新价格：{price}
