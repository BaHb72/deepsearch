app:
  author: BaHb
  data_dir: ./data
  debug: false
  env: prod
  name: DeepSearch
data_source_prefetch:
  enabled: true
  interval_seconds: 300
  job_type: prefetch_stock_basics
  max_job_age_minutes: 45
data_sources:
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    half_open_attempts: 3
    recovery_timeout: 60
  default: miniqmt
  failover:
    backoff_factor: 2
    enabled: true
    retry_count: 3
    timeout: 5
  fallback_order:
  - miniqmt
  - akshare
  providers:
    akshare:
      config:
        mode: direct
        proxy:
          cache:
            enabled: true
            ttl: 300
          enabled: true
          fallback_to_direct: true
          retry_count: 3
          timeout: 30
          worker_url: https://your-cloudflare-worker.example.com
        timeout: 30
      enabled: true
      priority: 3
    amazingdata:
      config:
        cache:
          enabled: true
          max_size: 10000
          ttl: 300
        connection:
          auto_reconnect: true
          heartbeat_interval: 60
          host: 101.230.159.234
          max_retries: 3
          network_provider: telecom
          password: 212200038719@2025
          port: 8600
          python_interpreter_path: C:/Python313/python.exe
          reconnect_interval: 10
          tgw_log_path: C:/Galaxy/gateway/logs
          timeout: 5000
          username: 212200038719
        host: 101.230.159.234
        implementation_mode: process
        monitoring:
          enabled: true
          log_slow_requests: true
          metrics_enabled: true
          report_interval: 60
          slow_request_threshold: 1000
          timeout: 5000
        password: 212200038719@2025
        port: 8600
        subscription:
          auto_resubscribe: true
          batch_size: 100
          enabled: true
          max_symbols: 500
        timeout: 5000
        username: 212200038719
      enabled: true
      fallback_enabled: false
      fallback_sources:
      - akshare
      has_saved_credential: true
      priority: 1
      provider_name: amazingdata
      retry_count: 3
      timeout: 10.0
    miniqmt:
      config:
        cache:
          enabled: true
          ttl: 60
        host: localhost
        port: 58610
        timeout: 10
      enabled: true
      priority: 1
  realtime:
    adapters:
    - driver: miniqmt
      enabled: true
      health:
        cool_down_seconds: 30
        failure_threshold: 3
        probe_timeout_seconds: 5
      name: miniqmt
      priority: 1
    - driver: amazingdata
      enabled: true
      health:
        cool_down_seconds: 30
        failure_threshold: 3
        probe_timeout_seconds: 5
      name: amazingdata
      priority: 2
    - driver: akshare_polling
      enabled: false
      name: akshare
      options:
        batch_size: 50
        use_proxy: false
      priority: 3
    alert_policy:
      channels:
      - ops-bot
      enabled: true
      failure_threshold: 3
      window_seconds: 300
    health_check_interval: 120
database:
  cache:
    auto_start_windows: true
    db: 0
    enabled: true
    health_check_interval: 30
    host: localhost
    idle_check_interval: 60
    max_idle_time: 300
    password: ''
    pool_size: 10
    port: 6379
    retry_on_timeout: true
    socket_connect_timeout: 5
    socket_keepalive: true
    socket_timeout: 5
    startup_command:
    - wsl.exe
    - -d
    - Ubuntu
    - -u
    - root
    - service
    - redis-server
    - start
    wsl:
      auto_resolve_ip: true
      distro: Ubuntu
      enabled: true
      service_name: redis-server
      user: root
  main:
    auto_connect: true
    database: deepsearch
    echo: false
    enabled: true
    host: localhost
    password: '123456'
    path: ./data/deepsearch.db
    port: 5432
    type: postgresql
    username: postgres
log:
  active: true
  archive:
    archive_after_days: 7
    enabled: true
    format: zip
    purge_after_days: 60
  enable_json: false
  level: INFO
  modules:
    directory: modules
    enabled: false
    max_depth: 2
    retention_days: 7
    rotation: 00:00
  retention_days: 7
  rotation: 00:00
market_data:
  modules:
    auction_quality:
      fallbacks:
      - cache_ttl_seconds: 45
        min_interval_seconds: 10
        phases:
        - auction
        - off_day
        source: akshare
        trigger_errors:
        - DATA_SOURCE_OFFLINE
      primary: miniqmt
    board_overview:
      fallbacks:
      - cache_ttl_seconds: 120
        min_interval_seconds: 30
        phases:
        - off_day
        source: akshare
        trigger_errors:
        - DATA_SOURCE_OFFLINE
      primary: miniqmt
    order_imbalance:
      fallbacks:
      - cache_ttl_seconds: 60
        min_interval_seconds: 15
        phases:
        - off_day
        - no_trade
        source: akshare
        trigger_errors:
        - DATA_SOURCE_OFFLINE
      primary: miniqmt
    strength:
      fallbacks:
      - cache_ttl_seconds: 90
        min_interval_seconds: 15
        phases:
        - off_day
        - no_trade
        source: akshare
        trigger_errors:
        - DATA_SOURCE_OFFLINE
        - SESSION_EXPIRED
      primary: miniqmt
  realtime:
    auction_interval_seconds: 1.0
    auction_timeout_seconds: 2.0
    boards:
    - 主板
    - 创业板
    - 科创板
    - 北证
    capital_limit: 50
    capital_windows:
    - duration_seconds: 60
      name: 1m
    - duration_seconds: 300
      name: 5m
    continuous_interval_seconds: 1.0
    continuous_timeout_seconds: 3.5
    enabled: true
    include_markets:
    - SH_MAIN
    - SZ_MAIN
    - STAR
    - SZ_GEM
    - BSE
    - INDEX
    - ETF
    initial_step_timeout_seconds: 12.0
    interval_seconds: 1.0
    no_trade_interval_seconds: 5.0
    no_trade_timeout_seconds: 1.0
    off_day_interval_seconds: 60.0
    off_day_timeout_seconds: 0.5
    order_limit: 100
    order_window:
      duration_seconds: 60
      name: 1m
    redis:
      auction_ttl: 180
      imbalance_ttl: 180
      max_strength_entries: 50
      strength_ttl: 180
      url: redis://localhost:6379/6
    request_timeout_seconds: 3.0
message_bus:
  buses:
    inmem:
      config: {}
      enabled: true
      type: inmem
  routes:
  - buses:
    - inmem
    match: '*'
notifications:
  bark_token: unit-test-token
  base_urls:
    bark: https://bark.xtuis.cn
    wechat: https://wx.xtuis.cn
  body_template: 最新价格：{price}
  categories:
    alert:
      channels:
      - wechat
      enabled: true
      max_per_window: 3
      window_seconds: 180
    info:
      channels:
      - wechat
      - bark
      enabled: true
      max_per_window: 10
      window_seconds: 600
  default_channel: wechat
  enabled: true
  request_timeout: 6.5
  retry_attempts: 2
  retry_delay: 1.0
  title_template: 测试默认标题 {symbol}
  wechat_token: unit-test-token
runtime:
  mode: full
webui:
  backend_host: 0.0.0.0
  backend_port: 8000
  enable_cors: true
  enabled: true
  frontend_enabled: true
  frontend_host: localhost
  frontend_port: 3000
  reload: false
