database:
  main:
    enabled: true  # 设置为 false 可以禁用数据库
    type: postgresql
    host: localhost
    port: 5432
    database: deepsearch
    username: bahb
    password: '123456'  # 可以使用明文或加密密码 (格式: encrypted:xxxxx)
    path: ./data/deepsearch.db
  cache:
    enabled: true
    host: localhost
    port: 6379
    password: ''
    db: 0
    poolSize: 10
    pool_size: 10

message_bus:
  buses:
    inmem:
      type: inmem
      enabled: true
      config: { }
  routes:
    - match: "*"
      buses: [ "inmem" ]

# 健康检查配置
health_check:
  enabled: true                   # 是否启用健康检查
  interval: 30.0                  # 健康检查间隔（秒）
  timeout: 5.0                    # 单个健康检查超时时间（秒）
  
  # 各组件的健康检查开关
  components:
    database: true
    cache: true
    event_engine: true
    message_bus: true
    monitor: true
    gateway: true
  
  # 高级配置
  history_size: 100               # 保留的历史记录数量
  alert_enabled: false            # 是否启用健康状态告警
  alert_threshold: 3              # 连续失败多少次后触发告警
