app:
  appName: DeepSearch
  env: dev
  debug: true
  name: DeepSearch
  author: BaHb
log:
  level: INFO
  format: verbose
  toFile: true
  toConsole: true
  active: true
  rotation: 00:00
  retention_days: 30
  enable_json: false
database:
  main:
    type: postgresql
    host: localhost
    port: 5432
    database: deepsearch
    username: bahb
    password: '123456'
    path: ./data/deepsearch.db
    auto_connect: true
    enabled: true
    has_saved_password: true
  cache:
    enabled: true
    host: localhost
    port: 6379
    password: ''
    db: 0
    poolSize: 10
    auto_connect: true
    pool_size: 10
    socket_timeout: 5
    socket_connect_timeout: 5
    socket_keepalive: true
    retry_on_timeout: true
    health_check_interval: 30
    max_idle_time: 300
    idle_check_interval: 60
    has_saved_password: false

# CloudFlare Workers 配置 - 用于 AkShare API 代理
cloudflare_workers:
  url: "https://akshare-proxy.934073514.workers.dev"  # CloudFlare Worker URL，已包含 https://
  api_key: ""  # API密钥（如果Worker需要认证）
  fallback_to_direct: true  # Worker不可用时回退到直连
  timeout: 30  # 请求超时（秒）
  retry_count: 3  # 重试次数
  cache_enabled: true  # 启用本地缓存
  cache_ttl: 300  # 缓存过期时间（秒）

# AmazingData 配置（银河证券数据接口）
amazingdata:
  enabled: false  # 是否启用（需要有效的许可证）
  api_key: ""  # API密钥
  api_secret: ""  # API密钥

# QMT 配置（迅投QMT终端）
qmt:
  enabled: false  # 是否启用（需要安装QMT终端）
  host: "localhost"  # QMT服务地址
  port: 8888  # QMT服务端口
