# 应用配置
app:
  name: DeepSearch
  env: dev
  debug: true

# 日志配置
log:
  level: DEBUG
  format: verbose
  toFile: true
  toConsole: true

database:
  main:
    enabled: true  # 设置为 false 可以禁用数据库
    type: postgresql
    host: localhost
    port: 5432
    database: deepsearch
    username: bahb
    password: '123456'  # 可以使用明文或加密密码 (格式: encrypted:xxxxx)
    path: ./data/deepsearch.db
  cache:
    enabled: true
    host: localhost
    port: 6379
    password: ''
    db: 0
    poolSize: 10
    pool_size: 10
  analytics: # DuckDB 分析数据库
    enabled: true
    path: ./data/analytics/market.duckdb
    memory_limit: 4GB
    threads: 4
    temp_directory: ./data/analytics/temp
    auto_sync: true
    sync_interval: 3600

message_bus:
  buses:
    inmem:
      type: inmem
      enabled: true
      config: { }
  routes:
    - match: "*"
      buses: [ "inmem" ]

# 健康检查配置
health_check:
  enabled: true                   # 是否启用健康检查
  interval: 30.0                  # 健康检查间隔（秒）
  timeout: 5.0                    # 单个健康检查超时时间（秒）
  
  # 各组件的健康检查开关
  components:
    database: true
    cache: true
    event_engine: true
    message_bus: true
    monitor: true
    gateway: true
  
  # 高级配置
  history_size: 100               # 保留的历史记录数量
  alert_enabled: false            # 是否启用健康状态告警
  alert_threshold: 3              # 连续失败多少次后触发告警

# QMT集成配置
qmt:
  enabled: true
  receiver:
    tcp_port: 9999
    websocket_port: 9998
    host: "0.0.0.0"
  security:
    enable_auth: false  # 开发环境关闭认证
    token: "dev-token-123456"
  data:
    batch_size: 100
    flush_interval: 0.1
    cache_ttl: 60  # 数据缓存时间（秒）
  monitoring:
    enabled: true
    report_interval: 30  # 状态报告间隔（秒）

# Cloudflare Workers 代理配置
cloudflare_workers:
  url: ""  # Worker URL，例如: your-worker.workers.dev
  api_key: ""  # 可选，与 Worker 的 API_KEY 一致
  fallback_to_direct: true  # Worker 不可用时是否回退到直连

# MiniQMT集成配置
miniqmt:
  enabled: true
  connection:
    host: "127.0.0.1"
    port: 7777
    username: ""
    password: ""
    timeout: 10
  data:
    symbols: [ ]  # 默认订阅的股票列表
    period: "1d"
    cache_ttl: 60
    batch_size: 100
  monitoring:
    enabled: true
    heartbeat_interval: 30
    report_interval: 60

# 数据提供者配置
data_providers:
  # 设置默认数据源
  default: "amazingdata"
  
  # 只使用QMT模式（用于测试）
  qmt_only: false
  
  # AmazingData数据源（最高优先级）
  amazingdata:
    enabled: true
    priority: 1  # 最高优先级
  
  # QMT数据源
  qmt:
    enabled: true
    priority: 2  # 第二优先级
  
  # Cloudflare代理（禁用）
  cloudflare_proxy:
    enabled: false
    priority: 10
  
  # AkShare直连（禁用）
  akshare_proxy:
    enabled: false
    priority: 20
  
  # UnifiedDataManager（禁用）
  unified:
    enabled: false
    priority: 15
  
  # 直连API（禁用）  
  direct_api:
    enabled: false
    priority: 30

# AmazingData配置
amazingdata:
  enabled: true
  priority: 1  # 最高优先级
  
  # 连接配置
  connection:
    username: "212200038719"  # AmazingData用户名
    password: "21220003871920250820"  # AmazingData密码（建议使用encrypted:格式）
    host: "120.86.124.106"  # AmazingData服务器地址
    port: 8600  # AmazingData服务端口
    timeout: 10  # 连接超时（秒）
    max_retries: 3  # 最大重试次数
    heartbeat_interval: 30  # 心跳间隔（秒）
    auto_reconnect: true  # 自动重连
  
  # 缓存配置
  cache:
    enabled: true
    ttl: 300  # 缓存过期时间（秒）
    max_size: 10000  # 最大缓存条目数
    clear_on_disconnect: false  # 断连时是否清除缓存
  
  # 订阅配置
  subscription:
    enabled: true
    batch_size: 100  # 批量订阅大小
    heartbeat_interval: 30  # 订阅心跳间隔（秒）
    max_symbols: 500  # 最大订阅股票数
    auto_resubscribe: true  # 断线后自动重新订阅
  
  # 数据质量配置
  data_quality:
    check_enabled: true  # 启用数据质量检查
    min_completeness: 0.95  # 最小完整性要求
    alert_on_error: true  # 错误时告警
    validate_timestamps: true  # 验证时间戳
  
  # 性能配置
  performance:
    batch_requests: true  # 启用批量请求
    max_concurrent_requests: 10  # 最大并发请求数
    request_queue_size: 1000  # 请求队列大小
    use_connection_pool: true  # 使用连接池
    pool_size: 5  # 连接池大小
  
  # 监控配置
  monitoring:
    enabled: true
    report_interval: 60  # 状态报告间隔（秒）
    metrics_enabled: true  # 启用指标收集
    log_slow_requests: true  # 记录慢请求
    slow_request_threshold: 1000  # 慢请求阈值（毫秒）
