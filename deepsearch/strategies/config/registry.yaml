# DeepSearch Strategy Registry
# 策略注册表 - 定义所有可用策略的元数据
#
# 此配置文件由系统扫描生成，也可手动编辑
# 策略代码位于 implementations/ 目录下

version: "1.0.0"
updated_at: "2025-12-29"

# 策略分类定义
categories:
  trend_following:
    name: 趋势跟踪
    description: 基于趋势判断的策略，适合单边行情
    icon: trending_up
  mean_reversion:
    name: 均值回归
    description: 基于价格回归均值的策略，适合震荡行情
    icon: sync_alt
  momentum:
    name: 动量策略
    description: 基于价格动量的策略
    icon: speed
  composite:
    name: 组合策略
    description: 多策略组合
    icon: layers

# 策略注册列表
strategies:
  # ==========================================
  # 趋势跟踪类策略
  # ==========================================
  - id: ma_crossover
    file: implementations/moving_average.py
    class: MovingAverageStrategy
    name: 均线交叉策略
    description: 基于快慢均线金叉/死叉的趋势跟踪策略。当短期均线上穿长期均线时买入，下穿时卖出。
    category: trend_following
    tags: [均线, 金叉死叉, 趋势, 经典]
    params:
      short_period:
        type: int
        default: 10
        min: 2
        max: 60
        label: 短期均线周期
      long_period:
        type: int
        default: 30
        min: 5
        max: 250
        label: 长期均线周期
      position_size:
        type: int
        default: 100
        min: 100
        max: 10000
        step: 100
        label: 单次交易数量
      max_positions:
        type: int
        default: 5
        min: 1
        max: 20
        label: 最大持仓数量
    enabled: true
    version: "1.0.0"
    author: system

  - id: simple_ma
    file: implementations/simple_ma.py
    class: SimpleMAStrategy
    name: 简单均线策略
    description: 基于单一均线的趋势策略。价格上穿均线买入，下穿均线卖出。
    category: trend_following
    tags: [均线, 简单, 入门]
    params:
      ma_period:
        type: int
        default: 20
        min: 5
        max: 120
        label: 均线周期
      position_size:
        type: int
        default: 100
        label: 交易数量
    enabled: true
    version: "1.0.0"
    author: system

  - id: turtle_trading
    file: implementations/turtle_trading.py
    class: TurtleTradingStrategy
    name: 海龟交易策略
    description: 经典的海龟交易系统，基于突破交易。当价格突破N日高点时买入，跌破M日低点时卖出。
    category: trend_following
    tags: [突破, 海龟, 经典, 趋势]
    params:
      entry_period:
        type: int
        default: 20
        min: 10
        max: 55
        label: 入场突破周期
      exit_period:
        type: int
        default: 10
        min: 5
        max: 20
        label: 出场突破周期
      atr_period:
        type: int
        default: 20
        min: 10
        max: 30
        label: ATR周期
      atr_multiplier:
        type: float
        default: 2.0
        min: 1.0
        max: 4.0
        step: 0.5
        label: ATR乘数
    enabled: true
    version: "1.0.0"
    author: system

  # ==========================================
  # 均值回归类策略
  # ==========================================
  - id: mean_reversion_rsi
    file: implementations/mean_reversion.py
    class: MeanReversionStrategy
    name: RSI均值回归
    description: 基于RSI超买超卖的均值回归策略。RSI低于超卖线时买入，高于超买线时卖出。
    category: mean_reversion
    tags: [RSI, 震荡, 反转, 超买超卖]
    params:
      rsi_period:
        type: int
        default: 14
        min: 5
        max: 30
        label: RSI周期
      overbought:
        type: float
        default: 70
        min: 60
        max: 90
        label: 超买阈值
      oversold:
        type: float
        default: 30
        min: 10
        max: 40
        label: 超卖阈值
      position_size:
        type: int
        default: 100
        label: 交易数量
    enabled: true
    version: "1.0.0"
    author: system

  # ==========================================
  # 动量类策略
  # ==========================================
  - id: momentum_breakout
    file: implementations/momentum.py
    class: MomentumStrategy
    name: 动量突破策略
    description: 基于价格动量和成交量确认的突破策略。当价格动量强劲且成交量放大时入场。
    category: momentum
    tags: [动量, 突破, 成交量]
    params:
      momentum_period:
        type: int
        default: 20
        min: 5
        max: 60
        label: 动量计算周期
      volume_factor:
        type: float
        default: 1.5
        min: 1.0
        max: 3.0
        step: 0.1
        label: 成交量放大倍数
      entry_threshold:
        type: float
        default: 0.05
        min: 0.01
        max: 0.15
        step: 0.01
        label: 入场阈值
    enabled: true
    version: "1.0.0"
    author: system

# ==========================================
# 默认配置
# ==========================================
defaults:
  initial_capital: 100000
  commission:
    rate: 0.0002          # 万二
    min_commission: 5.0   # 最低5元 (不免五)
    stamp_tax: 0.001      # 印花税千一 (仅卖出)
    transfer_fee: 0.00001 # 过户费
  slippage: 0.0           # 滑点 (日级策略暂不模拟)
