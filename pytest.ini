[pytest]
minversion = 8.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# 添加源代码路径到sys.path
pythonpath = .

# 测试输出配置
addopts =
    -v
    --strict-markers
    --tb=short
    --cov=deepsearch
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-report=xml
    --cov-config=.coveragerc
    --benchmark-disable

# 标记定义
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks tests as integration tests
    unit: marks tests as unit tests
    asyncio: marks tests as async tests
    benchmark: marks tests as benchmark tests
    manual: marks tests requiring manual environment or credentials
    external: marks tests requiring external services, SDKs, or local processes
    miniqmt: marks tests requiring a real MiniQMT environment
    amazingdata: marks tests requiring a real AmazingData environment
    requires_cloudflare: marks tests depending on Cloudflare external services
    requires_akshare: marks tests depending on Akshare external services

# 异步测试配置
asyncio_mode = auto

# 单测试兜底超时，真实外部集成测试可通过命令行 --timeout 覆盖
timeout = 300
timeout_method = thread

# 日志配置
log_cli = true
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s
log_cli_date_format = %Y-%m-%d %H:%M:%S

# 忽略警告
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning
