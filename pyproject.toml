[project]
name = "deepsearch"
version = "0.1.0"
description = "专注研究市场行为"
requires-python = ">=3.13"
# ==== 运行时依赖（生产环境真正需要）====
dependencies = [
    "anyio>=4.9.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.3",
    "platformdirs>=4.3.8",
    "pydantic>=2.11.7",
    "pydantic-settings>=2.10.1",
    "pytest>=8.4.1",
    "pytest-tornasync>=0.6.0.post2",
    "pytest-trio>=0.8.0",
    "pytest-twisted>=1.14.3",
    "pyyaml>=6.0.2",
    "pyzmq>=27.0.0",
    "redis>=3.5.3,<4",
    "redistimeseries>=1.4.3",
    "twisted>=25.5.0",
    "typing-extensions==4.14.1",
]

# ==== 可选依赖：测试 ====
[project.optional-dependencies]
tests = [
    "pytest>=8.4.1",
    "pytest-tornasync>=0.6.0.post2",
    "pytest-trio>=0.8.0",
    "pytest-twisted>=1.14.3",
]

# （可选）你可以继续添加其它 extra，比如文档、CI 等
