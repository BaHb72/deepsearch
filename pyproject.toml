[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsearch"
version = "0.1.0"
description = "高性能量化交易事件系统"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "BaHb", email = "bahb@example.com" },
]
requires-python = ">=3.13,<3.14"
dependencies = [
    # ==== 核心依赖 ====
    "anyio>=4.11.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.7",
    "platformdirs>=4.5.0",
    "pydantic>=2.12.2",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "twisted>=25.5.0",

    "redis>=6.4.0",
    "redistimeseries>=1.4.3",
    "cryptography>=46.0.2",
    "pika>=1.3.0",  # RabbitMQ Python 客户端
    "distributed>=2024.1.0",  # Dask 分布式客户端
    # ==== 数据库依赖 ====
    "sqlalchemy>=2.0.44",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.10",
    "duckdb>=1.4.1",
    "aiosqlite>=0.20.0",
    # ==== Web UI 依赖 ====
    "fastapi==0.119.0",
    "uvicorn[standard]>=0.37.0",
    "python-multipart>=0.0.20",
    "websockets>=15.0.1",
    "httpx>=0.28.1",
    "python-jose[cryptography]>=3.5.0",
    # ==== 数据获取依赖 ====
    "amazingdata==1.0.23",
    "tgw==1.0.8.5",
    "akshare==1.17.65",
    "aiohttp>=3.13.0",
    "numpy>=1.24.0",
    "pandas>=2.3.3,<2.4.0",
    # ==== 其他依赖 ====
    "psutil>=7.1.0",
    "aioredis>=2.0.1",
    "tabulate>=0.9.0",
    "notebook>=7.4.7",
    "backtrader>=1.9.78.123",
    "setuptools>=80.9.0",
    "click==8.3.0",
    "scipy>=1.16.2",
    "ta-lib>=0.6.7",
    "xxhash>=3.6.0",
    "pandas-stubs>=2.3.2.250926,<2.4.0",
    "schedule>=1.2.2",
    "chardet>=5.2.0",
    "python-dateutil>=2.9.0.post0",
    "types-pywin32>=311.0.0.20251008",
    "xtquant>=250516.1.1",
    "tigeropen>=3.4.4",
    "python-docx>=1.2.0",
    "tables>=3.10.2",
    "pypinyin>=0.55.0",
    "apscheduler>=3.11.1",
    "pyarrow>=22.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.4.2",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "pytest-tornasync>=0.6.0.post2",
    "pytest-trio>=0.8.0",
    "pytest-twisted>=1.14.3",
    "pytest-xdist>=3.6.1",
    "isort>=5.12",
    "mypy>=1.0",
    "types-PyYAML>=6.0.12",
    "ipython>=9.6.0",
]

[project.urls]
Homepage = "https://github.com/BaHb/deepsearch"
Repository = "https://github.com/BaHb/deepsearch.git"

[project.scripts]
deepsearch = "deepsearch.main:main"

[tool.setuptools]
packages = ["deepsearch"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
exclude = [
    "deepsearch/infrastructure/providers/datafeed/qmt/scripts",
    "examples/akshare_resources/getakshare.ipynb",
    "typings",
    "scripts",
]

[tool.ruff.lint]
# E402: 模块级导入不在文件顶部（某些文件需要条件导入）
# E501: 行太长（black已处理，ruff不检查）
ignore = ["E402", "E501"]


[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv]
python-preference = "only-system"
compile-bytecode = true

[tool.uv.sources]
amazingdata = { path = "packages/AmazingData-1.0.23-cp313-none-any.whl" }
tgw = { path = "packages/tgw-1.0.8.5-py3-none-any.whl" }

[tool.uv.pip]
index-url = "https://pypi.org/simple"

[dependency-groups]
dev = [
    "bandit>=1.8.6",
    "black>=25.9.0",
    "mypy>=1.18.2",
    "pre-commit>=4.5.1",
    "pytest>=8.4.2",
    "pytest-asyncio>=1.2.0",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=6.3.0",
    "pytest-mock>=3.15.0",
    "ruff>=0.14.0",
    "types-PyYAML>=6.0.12",
]
[tool.mypy]
python_version = "3.13"
# 为第三方依赖补充的本地类型桩
mypy_path = ["typings"]
warn_unused_ignores = false
warn_return_any = false
show_error_codes = true
pretty = true

# 忽略历史遗留类型问题较多的模块
[[tool.mypy.overrides]]
module = [
    "deepsearch.webui.*",
    "deepsearch.infrastructure.*",
    "deepsearch.adapters.*",
    "deepsearch.memory.*",
    "deepsearch.compute.*",
    "deepsearch.application.services.*",
    "deepsearch.application.data.handlers",
    "deepsearch.strategies.*",
    "deepsearch.ports.data.semantic_types",
    "deepsearch.core.utils.status_display",
    "deepsearch.core.components.data_components",
    "deepsearch.domain.data_proxy.*",
    "pika.*",
]
ignore_errors = true

# pika 是第三方库，忽略 import
[[tool.mypy.overrides]]
module = ["pika", "pika.*", "win32api", "win32api.*"]
ignore_missing_imports = true

# config.manager 使用动态导入
[[tool.mypy.overrides]]
module = [
    "deepsearch.config.manager",
    "deepsearch.core.*",
    "deepsearch.backtest.*",
    "deepsearch.constants.*",
]
ignore_errors = true
