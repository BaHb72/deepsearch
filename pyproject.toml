[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "deepsearch"
version = "0.1.0"
description = "高性能量化交易事件系统"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "BaHb", email = "bahb@example.com" },
]
requires-python = ">=3.8"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyzmq>=25.0",
    "redis>=5.0",
    "loguru>=0.7",
    "pyyaml>=6.0",
    "platformdirs>=4.0",
    "fastapi>=0.116.1",
    "uvicorn>=0.33.0",
    "websockets>=13.1",
    "psutil>=7.0.0",
    "python-multipart>=0.0.6",
    "httpx>=0.24.0",
    "python-jose>=3.3.0",
    "aioredis>=2.0.1",
    "tabulate>=0.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "pytest-mock>=3.10",
    "black>=23.0",
    "isort>=5.12",
    "mypy>=1.0",
    "ipython>=8.0",
]

[project.urls]
Homepage = "https://github.com/BaHb/deepsearch"
Repository = "https://github.com/BaHb/deepsearch.git"

[project.scripts]
deepsearch = "deepsearch.main:main"

[tool.setuptools]
packages = ["deepsearch"]

[tool.black]
line-length = 100

[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
