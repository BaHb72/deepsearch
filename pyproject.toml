[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "core"
version = "0.1.0"
description = "DeepSearch 高性能量化交易事件系统核心库"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "BaHb", email = "bahb@example.com" },
]
requires-python = ">=3.14,<3.15"
dependencies = [
    # ==== 核心依赖 ====
    "anyio>=4.11.0",
    "loguru>=0.7.3",
    "matplotlib>=3.10.8",
    "platformdirs>=4.5.0",
    "pydantic>=2.12.2",
    "pydantic-settings>=2.11.0",
    "python-dotenv>=1.1.1",
    "pyyaml>=6.0.3",
    "twisted>=25.5.0",
    "redis>=7.2.0",
    "cryptography>=46.0.7",
    "pika>=1.3.0", # RabbitMQ Python 客户端
    "distributed>=2026.3.0", # Dask 分布式客户端
    "dask>=2026.3.0",
    # ==== 数据库依赖 ====
    "sqlalchemy>=2.0.49",
    "asyncpg>=0.31.0",
    "psycopg[binary]>=3.3.3",
    "duckdb>=1.5.1",
    "aiosqlite>=0.20.0",
    # ==== Web UI 依赖 ====
    "fastapi>=0.135.3",
    "uvicorn[standard]>=0.44.0",
    "python-multipart>=0.0.20",
    "websockets>=15.0.1",
    "httpx>=0.28.1",
    "python-jose[cryptography]>=3.5.0",
    # ==== 数据获取依赖 ====
    "amazingdata==1.1.0",
    "tgw==1.0.8.6",
    "akshare>=1.18.54",
    "aiohttp>=3.13.0",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    # ==== 其他依赖 ====
    "psutil>=7.1.0",
    "aioredis>=2.0.1",
    "tabulate>=0.9.0",
    "notebook>=7.4.7",
    "backtrader>=1.9.78.123",
    "setuptools>=80.9.0",
    "click>=8.3.2",
    "scipy>=1.17.1",
    "ta-lib>=0.6.7",
    "xxhash>=3.6.0",
    "pandas-stubs>=3.0.0.260204",
    "schedule>=1.2.2",
    "chardet>=5.2.0",
    "python-dateutil>=2.9.0.post0",
    "types-pywin32>=311.0.0.20251008",
    "tigeropen>=3.5.7",
    "python-docx>=1.2.0",
    "tables>=3.11.1",
    "pypinyin>=0.55.0",
    "apscheduler>=3.11.1",
    "pyarrow>=23.0.1",
    "dependency-injector>=4.48.3",
    "lz4>=4.4.5",
    "aiocache>=0.12.3",
    "aiobreaker>=1.2.0",
    "numba>=0.65.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.10",
    "pytest-tornasync>=0.6.0.post2",
    "pytest-trio>=0.8.0",
    "pytest-twisted>=1.14.3",
    "pytest-xdist>=3.6.1",
    "isort==5.13.2",
    "mypy>=1.20.0",
    "types-PyYAML>=6.0.12",
    "ipython>=9.6.0",
]

[project.urls]
Homepage = "https://github.com/BaHb/deepsearch"
Repository = "https://github.com/BaHb/deepsearch.git"

[project.scripts]
deepsearch = "core.main:main"

[tool.setuptools]
package-dir = {"core" = "packages/core", "apps" = "apps"}

[tool.setuptools.packages.find]
where = ["packages", "."]
include = ["core*", "apps*"]
exclude = ["tests*", "docs*", "scripts*"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100
exclude = [
    "packages/core/infrastructure/providers/datafeed/qmt/scripts",
    "examples/akshare_resources/getakshare.ipynb",
    "typings",
    "scripts",
    "apps/web/node_modules",
]

[tool.ruff.lint]
# E402: 模块级导入不在文件顶部（某些文件需要条件导入）
# E501: 行太长（black已处理，ruff不检查）
# F841: 未使用变量（允许保留用于调试或未来使用）
ignore = ["E402", "E501", "F841"]


[tool.isort]
profile = "black"
line_length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.uv]
python-preference = "only-system"
compile-bytecode = true

[tool.uv.sources]
amazingdata = { path = "packages/AmazingData-1.1.0-cp314-none-any.whl" }
tgw = { path = "packages/tgw-1.0.8.6-py3-none-any.whl" }

[tool.uv.pip]
index-url = "https://pypi.org/simple"

[dependency-groups]
dev = [
    "bandit>=1.9.2",
    "black>=26.3.1",
    "isort==5.13.2",
    "mypy>=1.20.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.2.0",
    "pytest-benchmark>=5.1.0",
    "pytest-cov>=7.0.0",
    "pytest-mock>=3.15.0",
    "ruff>=0.15.10",
    "types-PyYAML>=6.0.12",
]
[tool.mypy]
python_version = "3.14"
# 为第三方依赖补充的本地类型桩
mypy_path = ["typings"]
# 暂时关闭以专注于真正的错误，后续开启进行清理
warn_unused_ignores = false
warn_return_any = false
show_error_codes = true
pretty = true
# SQLAlchemy 2.0 官方 mypy 插件已弃用（只支持 mypy<=1.10.1）
# SQLAlchemy 2.0 的 Mapped + mapped_column 语法原生支持 mypy，无需插件

# 第三方库缺少类型存根
[[tool.mypy.overrides]]
module = [
    "pika", "pika.*",
    "win32api", "win32api.*",
    "amazingdata", "amazingdata.*",
    "asyncpg", "asyncpg.*",
    "click", "click.*",
    "starlette", "starlette.*",
    "sqlalchemy", "sqlalchemy.*",
    "pyarrow.ipc", "pyarrow.ipc.*",
    "pypinyin", "pypinyin.*",
    "akshare", "akshare.*",
    "tigeropen", "tigeropen.*",
    "xtquant", "xtquant.*",
    "tgw", "tgw.*",
    "backtrader", "backtrader.*",
    "apscheduler", "apscheduler.*",
    "distributed", "distributed.*",
    "dask", "dask.*",
    "uvicorn", "uvicorn.*",
    "platformdirs", "platformdirs.*",
    "aiohttp", "aiohttp.*",
    "requests", "requests.*",
    "httpx", "httpx.*",
    "websockets", "websockets.*",
    "schedule", "schedule.*",
    "pytz", "pytz.*",
    "aiobreaker", "aiobreaker.*",
    "aiocache", "aiocache.*",
    "rich", "rich.*",
    "pytest", "pytest.*",
    "core.domain.interfaces.*",
    "core.domain.value_objects", "core.domain.value_objects.*",
    # 运行时条件导入或可选模块
    "deepsearch", "deepsearch.*",
    "core.infrastructure.providers.datafeed.qmt", "core.infrastructure.providers.datafeed.qmt.*",
    "core.domain.data_proxy.adapters.amazingdata",
    "core.infrastructure.providers.implementations.amazingdata.amazingdata_safe_wrapper",
    "dependency_injector", "dependency_injector.*",
]
ignore_missing_imports = true

# 运行时条件导入：这些文件包含动态/条件导入，mypy 无法静态解析
[[tool.mypy.overrides]]
module = [
    "apps.api.api.providers",
    "core.infrastructure.providers.implementations.amazingdata.amazingdata_extended",
]
disable_error_code = ["import-not-found"]
