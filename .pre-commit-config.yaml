# Pre-commit hooks for Git
# 安装: pip install pre-commit && pre-commit install
# 手动运行: pre-commit run --all-files
# 跳过: git commit --no-verify

repos:
  # Python代码格式化
  - repo: https://github.com/psf/black
    rev: 24.10.0
    hooks:
      - id: black
        language_version: python3.13
        args: [--line-length=100]

  # Import排序
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        args: [--profile=black, --line-length=100]

  # Python代码检查 (ruff 替代 flake8，更快更现代)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.8.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix, --ignore=E402]

  # 类型检查
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.13.0
    hooks:
      - id: mypy
        args: [--config-file=pyproject.toml]
        additional_dependencies: [types-PyYAML, types-redis, types-requests, types-pytz]
        exclude: ^(tests|docs|tools|typings|scripts)/

  # 通用文件格式检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace  # 删除尾部空格
      - id: end-of-file-fixer   # 文件末尾换行符
      - id: check-yaml          # YAML语法检查
      - id: check-json          # JSON语法检查
      - id: check-toml          # TOML语法检查
      - id: check-added-large-files  # 防止添加大文件
        args: [--maxkb=5000]
      - id: check-merge-conflict     # 检查合并冲突标记
      - id: debug-statements         # 检查调试语句
      - id: mixed-line-ending       # 统一行结束符
        args: [--fix=lf]

  # Markdown格式化
  - repo: https://github.com/igorshubovych/markdownlint-cli
    rev: v0.43.0
    hooks:
      - id: markdownlint
        args: [--fix]
        exclude: ^docs/strategy-center/

  # 提交信息检查
  - repo: https://github.com/commitizen-tools/commitizen
    rev: v3.30.1
    hooks:
      - id: commitizen
        stages: [commit-msg]

  # 安全检查
  - repo: https://github.com/Yelp/detect-secrets
    rev: v1.5.0
    hooks:
      - id: detect-secrets
        args: [--baseline, .secrets.baseline]
        exclude: .*\.(lock|yaml|yml)$

# 全局配置
default_language_version:
  python: python3.13

exclude: |
  (?x)^(
    .*\.(pyc|pyo|egg-info)/|
    __pycache__/|
    .git/|
    .venv/|
    venv/|
    build/|
    dist/|
    node_modules/|
    deepsearch/webui/frontend/|
    .*\.min\.(js|css)|
    .*\.bundle\.(js|css)
  )

ci:
  autofix_prs: true
  autoupdate_schedule: weekly
