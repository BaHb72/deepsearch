# Pre-commit hooks配置
# 用于在提交代码前自动检查代码质量，防止问题代码进入仓库

# 配置选项
default_language_version:
  python: python3.13

# 跳过的文件
exclude: |
  (?x)^(
    .*\.min\.js|
    .*\.min\.css|
    node_modules/.*|
    deepsearch/webui/frontend/dist/.*|
    htmlcov/.*|
    \.pytest_cache/.*|
    \.git/.*|
    \.venv/.*|
    build/.*|
    dist/.*|
    .*\.egg-info/.*
  )$

# Hook仓库配置
repos:
  # 基础检查
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      - id: trailing-whitespace
        name: 移除行尾空格
      - id: end-of-file-fixer
        name: 文件末尾换行符
      - id: check-yaml
        name: 检查YAML语法
      - id: check-json
        name: 检查JSON语法
      - id: check-toml
        name: 检查TOML语法
      - id: check-added-large-files
        name: 检查大文件
        args: ['--maxkb=1000']
      - id: check-merge-conflict
        name: 检查合并冲突标记
      - id: check-case-conflict
        name: 检查文件名大小写冲突
      - id: detect-private-key
        name: 检测私钥文件
      - id: mixed-line-ending
        name: 检查混合行尾
        args: ['--fix=lf']

  # Python代码格式化 - Black
  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        name: Black代码格式化
        language_version: python3.13
        args: ['--line-length=100', '--target-version=py313']

  # 导入排序 - isort
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
        name: isort导入排序
        args: ['--profile=black', '--line-length=100']

  # 代码质量检查 - Ruff (更快的替代flake8)
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.3.0
    hooks:
      - id: ruff
        name: Ruff代码检查
        args: ['--fix', '--exit-non-zero-on-fix']
      - id: ruff-format
        name: Ruff格式检查

  # 类型检查 - MyPy
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.9.0
    hooks:
      - id: mypy
        name: MyPy类型检查
        additional_dependencies:
          - types-requests
          - types-PyYAML
          - types-redis
          - types-aiofiles
          - types-tabulate
        args: [
          '--ignore-missing-imports',
          '--no-implicit-optional',
          '--warn-redundant-casts',
          '--warn-unused-ignores'
        ]
        exclude: 'tests/.*'

  # 安全检查 - Bandit
  - repo: https://github.com/PyCQA/bandit
    rev: 1.7.8
    hooks:
      - id: bandit
        name: Bandit安全扫描
        args: ['-r', 'deepsearch', '--skip', 'B101,B601']
        exclude: 'tests/.*'

  # 文档字符串检查
  - repo: https://github.com/pycqa/pydocstyle
    rev: 6.3.0
    hooks:
      - id: pydocstyle
        name: 文档字符串检查
        args: ['--convention=google']
        exclude: 'tests/.*|migrations/.*'

  # SQL注入检查
  - repo: https://github.com/ecugol/pre-commit-hooks-django
    rev: v0.4.0
    hooks:
      - id: check-sql-migrations
        name: SQL注入检查

  # 自定义本地hooks
  - repo: local
    hooks:
      # 检查Python文件编码
      - id: check-encoding
        name: 检查QMT脚本编码
        entry: python scripts/check_qmt_encoding.py
        language: python
        files: 'deepsearch/datafeed/qmt/scripts/.*\.py$'
        pass_filenames: true

      # 更新API文档
      - id: update-api-docs
        name: 更新API文档
        entry: python tools/generate_api_documentation.py --check
        language: python
        pass_filenames: false
        files: 'deepsearch/webui/api/.*\.py$'

      # 运行快速测试
      - id: quick-tests
        name: 运行快速测试
        entry: pytest tests/unit -x --tb=short -q -m "not slow"
        language: system
        pass_filenames: false
        stages: [push]

      # 检查依赖安全性
      - id: check-dependencies
        name: 检查依赖安全性
        entry: python -m pip_audit --desc
        language: system
        pass_filenames: false
        stages: [push]

      # 检查代码复杂度
      - id: check-complexity
        name: 检查代码复杂度
        entry: python -m mccabe --min 10 deepsearch
        language: system
        pass_filenames: false

      # 防止提交调试代码
      - id: no-debug-statements
        name: 检查调试语句
        entry: '(?i)(import pdb|pdb\.set_trace|breakpoint|console\.log|debugger)'
        language: pygrep
        types: [python, javascript, typescript]

      # 检查TODO标记
      - id: check-todos
        name: 检查TODO标记
        entry: '(?i)(TODO|FIXME|HACK|XXX|BUG):'
        language: pygrep
        types: [python]
        args: ['--multiline']

      # 验证配置文件
      - id: validate-config
        name: 验证配置文件
        entry: python scripts/validate_config.py
        language: python
        files: 'deepsearch/config/settings.*\.yaml$'
        pass_filenames: true

# CI跳过配置
ci:
  autofix_prs: true
  autofix_commit_msg: |
    [pre-commit.ci] 自动修复格式问题

  autoupdate_schedule: weekly
  autoupdate_commit_msg: '[pre-commit.ci] 更新hook版本'

  skip: [
    mypy,  # CI环境中跳过类型检查
    quick-tests,  # CI有专门的测试流程
  ]