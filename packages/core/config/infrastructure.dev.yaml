# =============================================================================
# 基础设施配置 - 开发环境
# 包含: database, cache, message_bus, dask
# =============================================================================

database:
  cache:
    auto_start_windows: true
    db: 0
    enabled: true
    health_check_interval: 30
    host: localhost
    idle_check_interval: 60
    max_idle_time: 300
    pool_size: 10
    port: 6379
    retry_on_timeout: true
    socket_connect_timeout: 5
    socket_keepalive: true
    socket_timeout: 5
    startup_command:
    - wsl.exe
    - -d
    - Ubuntu
    - -u
    - root
    - service
    - redis-server
    - start
    username: default
    windows_service_names:
    - Redis
    - redis
    wsl:
      auto_resolve_ip: true
      distro: Ubuntu
      enabled: false
      service_name: redis-server
      user: root
  main:
    auto_connect: true
    database: deepsearch
    echo: false
    enabled: true
    host: localhost
    password: encrypted:Z0FBQUFBQm85S1lyZ2o1bmZBSjhlNWFXTU45dm1YZVZEMFk3ZXVocE90U3l4c0ltbHptbFg2bEVZeG9QYkZrUGYwQUVVRUptQ2JDVjJwM0FEbjZSTGNXbEt0U2k1UGw1OUE9PQ==
    path: ./data/deepsearch.db
    port: 5432
    type: postgresql
    username: postgres

cache:
  arrow:
    base_dir: null
    default_ttl: 60
    enabled: true
    namespaces:
      amazingdata:
        ttl: 300
      miniqmt:
        ttl: 600

message_bus:
  buses:
    inmem:
      enabled: true  # 开发环境使用内存消息总线
      type: inmem
    timeseries:
      config:
        enable_persistence: true
        storage_config:
          db: 0
          duplicate_policy: LAST
          host: localhost
          key_prefix: 'deepsearch:ts:'
          port: 6379
          retention_ms: 86400000
        url: tcp://127.0.0.1:5555
      enabled: false
      type: timeseries
    zmq:
      config:
        host: 127.0.0.1
        pub_port: 5556
        recv_hwm: 1000
        send_hwm: 1000
        sub_port: 5557
        verbose: true
      enabled: false  # ZMQ 已废弃，使用 inmem 或 rabbitmq
      type: zmq
  routes:
  - buses:
    - inmem  # 改用 inmem 消息总线
    match: '*'

# =============================================================================
# Dask 分布式计算配置
# =============================================================================
dask:
  # Scheduler 地址 (Docker 容器运行，通过端口映射访问)
  scheduler_address: "localhost:8786"

  # 内存管理阈值配置
  # 参考: https://distributed.dask.org/en/stable/worker-memory.html
  memory_thresholds:
    target: 0.60     # 超过 60% 开始 spill 到磁盘
    spill: 0.70      # 超过 70% 强制激进 spill
    pause: 0.80      # 超过 80% 暂停接收新任务
    terminate: 0.95  # 超过 95% Nanny 重启 Worker

  windows_workers:
    enabled: true
    auto_start: true  # 随后端 API 自动启动
    num_workers: 1  # AmazingData SDK 只支持单连接，多 Worker 会导致竞争
    threads_per_worker: 2
    memory_limit: "8GB"   # 保守配置: 静态 3.5GB + 动态 3GB + 20% 余量
    name_prefix: "windows-worker"
    use_nanny: true       # 启用 Nanny 进程（使 terminate 阈值生效）
    local_directory: "./data/dask-scratch"  # spill to disk 目录（建议 SSD）
    resources:
      WIN: 1.0  # Windows 资源标签（必须为浮点数，符合 Dask 要求）

    # Worker 注册地址说明:
    # Worker 会自动使用 host.docker.internal 向 Scheduler 注册，
    # 确保 Docker 容器内的 Scheduler 能够回连到主机上的 Worker

  task_routing:
    windows_tasks:
      - data_fetch
      - amazingdata_*
      - miniqmt_*
      - akshare_*
      - realtime_quote
    linux_tasks:
      - compute_*
      - backtest_*
      - train_*
      - factor_*

# =============================================================================
# 统一超时配置
# 集中管理散落在代码各处的超时值，按环境调整
# =============================================================================
timeouts:
  dask:
    worker_ready: 30.0          # 等待 Worker 就绪
    amazingdata_init: 60.0      # 等待 AmazingData Dask 代理初始化
    shutdown: 15.0              # 关闭 Dask 集群
    circuit_breaker_recovery: 60.0  # 熔断器恢复

  amazingdata:
    normal_call: 45.0           # 普通 Actor 调用
    first_call: 90.0            # 首次调用（含 SDK 登录）
    sdk_login: 30.0             # SDK 登录
    actor_create: 60.0          # Actor 创建
    calendar_preload: 30.0      # 交易日历预加载

  shutdown:
    server: 3.0                 # 服务器关闭
    runner_stop: 5.0            # Runner 停止
    runner_stop_outer: 8.0      # Runner 停止外层保护
    cache_writer: 5.0           # 缓存写入器关闭
    provider_stop: 5.0          # 数据源停止
    task_cancel: 2.0            # 任务取消

  providers:
    akshare:
      idle: 5.0
      connect: 30.0
      fetch: 15.0
      batch: 300.0
      fallback: 10.0
    amazingdata:
      idle: 5.0
      connect: 90.0
      fetch: 45.0
      batch: 120.0
      fallback: 15.0
    miniqmt:
      idle: 5.0
      connect: 60.0
      fetch: 30.0
      batch: 180.0
      fallback: 10.0
