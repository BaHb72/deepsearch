# =============================================================================
# 基础设施配置 - 生产环境
# 包含: database, cache, message_bus, dask
# =============================================================================

database:
  cache:
    auto_start_windows: true
    db: 0
    enabled: true
    health_check_interval: 30
    host: localhost
    idle_check_interval: 60
    max_idle_time: 300
    password: ''
    pool_size: 10
    port: 6379
    retry_on_timeout: true
    socket_connect_timeout: 5
    socket_keepalive: true
    socket_timeout: 5
    startup_command: []  # Redis 在 Docker 中运行，无需自动启动
    wsl:
      auto_resolve_ip: false
      distro: Ubuntu
      enabled: false  # Redis 已迁移到 Docker，禁用 WSL 模式
      service_name: redis-server
      user: root
  main:
    auto_connect: true
    database: deepsearch
    echo: false
    enabled: true
    host: localhost
    password: '123456'
    path: ./data/deepsearch.db
    port: 5432
    type: postgresql
    username: postgres

cache:
  arrow:
    base_dir: null
    default_ttl: 300
    enabled: true
    namespaces:
      amazingdata:
        ttl: 600
      miniqmt:
        ttl: 300

message_bus:
  buses:
    inmem:
      config: {}
      enabled: true
      type: inmem
  routes:
  - buses:
    - inmem
    match: '*'

# =============================================================================
# Dask 分布式计算配置
# =============================================================================
dask:
  scheduler_address: "localhost:8786"

  windows_workers:
    enabled: true
    auto_start: true  # 随后端 API 自动启动
    num_workers: 1  # AmazingData SDK 只支持单连接，多 Worker 会导致竞争
    threads_per_worker: 2
    memory_limit: "8GB"
    name_prefix: "windows-worker"
    resources:
      WIN: 1

  task_routing:
    windows_tasks:
      - data_fetch
      - amazingdata_*
      - miniqmt_*
      - akshare_*
      - realtime_quote
    linux_tasks:
      - compute_*
      - backtest_*
      - train_*
      - factor_*

# =============================================================================
# 统一超时配置（生产环境，较开发环境更保守）
# =============================================================================
timeouts:
  dask:
    worker_ready: 45.0
    amazingdata_init: 90.0
    shutdown: 20.0
    circuit_breaker_recovery: 60.0

  amazingdata:
    normal_call: 60.0
    first_call: 120.0
    sdk_login: 45.0
    actor_create: 90.0
    calendar_preload: 45.0

  shutdown:
    server: 5.0
    runner_stop: 8.0
    runner_stop_outer: 12.0
    cache_writer: 5.0
    provider_stop: 8.0
    task_cancel: 3.0

  providers:
    akshare:
      idle: 5.0
      connect: 30.0
      fetch: 20.0
      batch: 300.0
      fallback: 10.0
    amazingdata:
      idle: 5.0
      connect: 120.0
      fetch: 60.0
      batch: 180.0
      fallback: 20.0
    miniqmt:
      idle: 5.0
      connect: 60.0
      fetch: 30.0
      batch: 180.0
      fallback: 10.0
