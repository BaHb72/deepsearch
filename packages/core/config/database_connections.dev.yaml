log:
  active: true
  enable_json: false
  level: INFO
  retention_days: 7
  rotation: 00:00
message_bus:
  buses:
    zmq:
      config:
        host: localhost
        pub_port: 5556
        sub_port: 5557
      enabled: true
      type: zmq
  routes:
  - buses:
    - zmq
    match: '*'
notifications:
  bark_token: unit-test-token
  base_urls:
    bark: https://bark.xtuis.cn
    wechat: https://wx.xtuis.cn
  body_template: 最新价格：{price}
  categories:
    alert:
      channels:
      - wechat
      enabled: true
      max_per_window: 3
      window_seconds: 180
    info:
      channels:
      - wechat
      - bark
      enabled: true
      max_per_window: 10
      window_seconds: 600
  default_channel: wechat
  enabled: true
  request_timeout: 6.5
  retry_attempts: 2
  retry_delay: 1.0
  title_template: 测试默认标题 {symbol}
  wechat_token: unit-test-token
runtime:
  mode: full
webui:
  backend_host: 0.0.0.0
  backend_port: 8000
  enable_cors: true
  enabled: true
  frontend_enabled: true
  frontend_host: localhost
  frontend_port: 3000
  reload: false
  workers: null
