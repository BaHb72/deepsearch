app:
  author: BaHb
  data_dir: ./data
  debug: false
  env: prod
  name: DeepSearch
data_sources:
  circuit_breaker:
    enabled: true
    failure_threshold: 5
    half_open_attempts: 3
    recovery_timeout: 60
  default: amazingdata
  failover:
    backoff_factor: 2
    enabled: true
    retry_count: 3
    timeout: 5
  fallback_order:
  - amazingdata
  - cloudflare
  - akshare
  providers:
    akshare:
      config:
        mode: direct
        proxy:
          enabled: false
        timeout: 30
      enabled: true
      priority: 3
    amazingdata:
      config:
        cache:
          enabled: true
          max_size: 10000
          ttl: 300
        connection:
          auto_reconnect: true
          heartbeat_interval: 60
          host: 101.230.159.234
          max_retries: 3
          network_provider: telecom
          password: your_amazingdata_password
          port: 8600
          python_interpreter_path: runtime/interpreters/py39/Scripts/python.exe
          reconnect_interval: 10
          tgw_log_path: C:/Galaxy/gateway/logs
          timeout: 10
          username: your_amazingdata_username
        local:
          path: D:/AmazingData/cache
          use_local: false
        monitoring:
          enabled: true
          log_slow_requests: true
          metrics_enabled: true
          report_interval: 60
          slow_request_threshold: 1000
        subscription:
          auto_resubscribe: true
          batch_size: 100
          enabled: true
          max_symbols: 500
        timeout: 5000
      enabled: false
      fallback_sources:
      - cloudflare
      - akshare
      has_saved_credential: false
      priority: 1
      worker_env: {}
    cloudflare:
      config:
        retry_count: 3
        timeout: 30
        worker_url: https://your-cloudflare-worker.example.com
      enabled: true
      has_saved_credential: false
      priority: 2
database:
  cache:
    auto_start_windows: true
    db: 0
    enabled: true
    health_check_interval: 30
    host: localhost
    idle_check_interval: 60
    max_idle_time: 300
    password: ''
    pool_size: 10
    port: 6379
    retry_on_timeout: true
    socket_connect_timeout: 5
    socket_keepalive: true
    socket_timeout: 5
    startup_arguments: []
    startup_binary_path: null
    startup_command:
    - wsl.exe
    - -d
    - Ubuntu
    - -u
    - root
    - service
    - redis-server
    - start
    username: ''
    windows_service_names: []
    wsl:
      auto_resolve_ip: true
      distro: Ubuntu
      enabled: true
      service_name: redis-server
      user: root
  main:
    auto_connect: false
    database: deepsearch
    echo: false
    enabled: true
    host: localhost
    password: encrypted:Z0FBQUFBQm85S1lyZ2o1bmZBSjhlNWFXTU45dm1YZVZEMFk3ZXVocE90U3l4c0ltbHptbFg2bEVZeG9QYkZrUGYwQUVVRUptQ2JDVjJwM0FEbjZSTGNXbEt0U2k1UGw1OUE9PQ==
    path: ./data/deepsearch.db
    port: 5432
    type: postgresql
    username: postgres
