# =============================================================================
# 市场数据配置 - 开发环境
# 包含: market_data, capability_routing
# =============================================================================

market_data:
  realtime:
    auction_interval_seconds: 5.0
    auction_timeout_seconds: 3.0
    boards:
    - 主板
    - 创业板
    - 科创板
    - 北证
    capital_limit: 50
    capital_windows:
    - duration_seconds: 60
      name: 1m
    - duration_seconds: 300
      name: 5m
    continuous_interval_seconds: 1.0
    continuous_timeout_seconds: 3.0
    enabled: true
    include_markets:
    - SH
    - SZ
    - BJ
    initial_step_timeout_seconds: 12.0
    interval_seconds: 1.0
    no_trade_interval_seconds: 45.0
    no_trade_timeout_seconds: 5.0
    off_day_interval_seconds: 120.0
    off_day_timeout_seconds: 5.0
    order_limit: 100
    order_window:
      duration_seconds: 60
      name: 1m
    redis:
      auction_ttl: 180
      imbalance_ttl: 180
      max_strength_entries: 50
      strength_ttl: 180
      url: redis://localhost:6379/6
    request_timeout_seconds: 3.0

# =============================================================================
# 能力路由配置
# =============================================================================
capability_routing:
  capabilities:
    miniqmt:
      kline:
        supported: true
        min_timeframe: "1m"
        max_timeframe: "1d"
        history_days: 90
        adjust_types: [none, qfq]
        realtime_capable: true
      realtime_quote:
        supported: true
        max_symbols: 500
        latency_ms: 100
      tick:
        supported: true
        max_symbols: 50
      quality:
        reliability: 0.95
        avg_latency_ms: 100

    amazingdata:
      kline:
        supported: true
        min_timeframe: "1m"
        max_timeframe: "1mo"
        history_days: 365
        adjust_types: [none, qfq, hfq]
        realtime_capable: true
      realtime_quote:
        supported: true
        max_symbols: 1000
        latency_ms: 200
        premarket: true
        afterhours: true
      quality:
        reliability: 0.9
        avg_latency_ms: 200

    akshare:
      kline:
        supported: true
        min_timeframe: "1d"
        max_timeframe: "1mo"
        history_days: 3650
        adjust_types: [none, qfq, hfq]
        realtime_capable: false
      stock_list:
        supported: true
        cache_ttl: 86400
      quality:
        reliability: 0.85
        avg_latency_ms: 1000
        rate_limit_per_minute: 60

  routing:
    kline:
      scenarios:
        realtime:
          priority: [miniqmt, amazingdata]
          fallback: true
        historical:
          priority: [akshare, amazingdata]
          fallback: true
      by_timeframe:
        "1m": [miniqmt, amazingdata]
        "5m": [miniqmt, amazingdata]
        "1d": [akshare, amazingdata]
      priority: [miniqmt, amazingdata, akshare]
      fallback: true

    realtime_quote:
      priority: [amazingdata, miniqmt]
      fallback: true

    tick:
      priority: [miniqmt]
      fallback: false

    stock_list:
      priority: [akshare]
      cache_ttl: 86400
