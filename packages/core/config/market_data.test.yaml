# =============================================================================
# 市场数据配置 - 测试环境
# 包含: market_data, capability_routing
# =============================================================================

market_data:
  realtime:
    enabled: false
    boards: []
    include_markets: []
    interval_seconds: 1.0
    request_timeout_seconds: 3.0
    capital_windows: []
    order_window: null
    auction_window: null
    capital_limit: 50
    order_limit: 100
    initial_step_timeout_seconds: 12.0
    off_day_interval_seconds: 120.0
    no_trade_interval_seconds: 45.0
    auction_interval_seconds: 5.0
    continuous_interval_seconds: 1.0
    off_day_timeout_seconds: 5.0
    no_trade_timeout_seconds: 5.0
    auction_timeout_seconds: 3.0
    continuous_timeout_seconds: 3.0
    redis:
      url: redis://localhost:6379/6
      strength_ttl: 180
      imbalance_ttl: 180
      auction_ttl: 180
      max_strength_entries: 50
  modules:
    strength:
      primary: amazingdata
      fallbacks:
        - source: akshare
          phases:
            - off_day
            - no_trade
          trigger_errors:
            - DATA_SOURCE_OFFLINE
            - SESSION_EXPIRED
          cache_ttl_seconds: 90
          min_interval_seconds: 15
    board_overview:
      primary: amazingdata
      fallbacks:
        - source: akshare
          phases:
            - off_day
          trigger_errors:
            - DATA_SOURCE_OFFLINE
          cache_ttl_seconds: 120
          min_interval_seconds: 30
    order_imbalance:
      primary: amazingdata
      fallbacks:
        - source: akshare
          phases:
            - off_day
            - no_trade
          trigger_errors:
            - DATA_SOURCE_OFFLINE
          cache_ttl_seconds: 60
          min_interval_seconds: 15
    auction_quality:
      primary: amazingdata
      fallbacks:
        - source: akshare
          phases:
            - auction
            - off_day
          trigger_errors:
            - DATA_SOURCE_OFFLINE
          cache_ttl_seconds: 45
          min_interval_seconds: 10

# 测试环境不需要能力路由配置
capability_routing: {}
