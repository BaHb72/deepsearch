[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "amazingdata"
version = "1.0.10"
description = "DeepSearch 本地占位版 AmazingData SDK，仅用于类型检查与测试环境"
requires-python = ">=3.9"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
