<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>概念板块 · 实时（方案A）· Ant Design 风格预览</title>
    <!-- Ant Design v5 样式（仅用于视觉风格） -->
    <link href="https://unpkg.com/antd@5.19.2/dist/reset.css" rel="stylesheet"/>
    <link href="https://unpkg.com/antd@5.19.2/dist/antd.min.css" rel="stylesheet"/>
    <style>
        body {
            background: #0b0f16;
        }

        .page {
            max-width: 1200px;
            margin: 24px auto;
            padding: 0 16px;
        }

        .ant-card {
            background: #0f1420;
            border-color: #1c2233;
        }

        .ant-typography, .ant-statistic-content, .ant-badge, .ant-tag {
            color: #e6edf7;
        }

        .muted {
            color: #93a0b4;
        }

        .title-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 12px;
            margin-bottom: 12px;
        }

        .toolbar {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .spacer {
            flex: 1;
        }

        /* 顶部 KPI + 迷你图 */
        .kpi-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
        }

        .mini {
            display: grid;
            gap: 8px;
        }

        .mini svg {
            width: 100%;
            height: 48px;
        }

        .mini .ant-statistic {
            margin-top: -4px;
        }

        /* 列表与条形对比 */
        .board-list {
            display: grid;
            gap: 8px;
            margin-top: 12px;
        }

        .board-row {
            background: #0f1420;
            border: 1px solid #1c2233;
            border-radius: 8px;
            padding: 12px;
        }

        .board-top {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .board-name {
            font-weight: 600;
            font-size: 14px;
        }

        .meta {
            margin-left: auto;
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .metrics {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 12px;
            margin-top: 10px;
        }

        .metric {
            display: grid;
            gap: 6px;
        }

        .metric .label {
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-size: 12px;
            color: #93a0b4;
        }

        /* 使用 AntD Progress 的结构与样式类，纯 CSS 可生效 */
        .ant-progress {
            margin: 0;
        }

        .ant-progress-line .ant-progress-inner {
            background: #12192a;
        }

        /* 控件微调 */
        .ant-radio-group {
            background: #0f1420;
            padding: 4px;
            border-radius: 6px;
        }

        .ant-radio-button-wrapper {
            background: transparent;
            color: #c9d4e3;
            border-color: #2a344a;
        }

        .ant-radio-button-wrapper-checked {
            background: #152038;
            color: #e6edf7;
        }
    </style>
</head>
<body>
<div class="page">
    <!-- 顶部标题与工具栏 -->
    <div class="title-row">
        <div>
            <h2 class="ant-typography" style="margin:0">概念板块 · 实时（方案A）</h2>
            <div class="muted" id="statusText">阶段：连续竞价 · asOf 14:57:00 · 更新 14:57:03 · 数据源 amazingdata</div>
        </div>
        <div class="toolbar">
            <div aria-label="单位切换" class="ant-radio-group" role="radiogroup">
                <label class="ant-radio-button-wrapper ant-radio-button-wrapper-checked" id="u-wan">
                    <span class="ant-radio-button">万</span>
                </label>
                <label class="ant-radio-button-wrapper" id="u-yi">
                    <span class="ant-radio-button">亿</span>
                </label>
                <label class="ant-radio-button-wrapper" id="u-raw">
                    <span class="ant-radio-button">原值</span>
                </label>
            </div>
            <div aria-label="窗口" class="ant-radio-group" role="radiogroup">
                <label class="ant-radio-button-wrapper ant-radio-button-wrapper-checked" id="w-1m"><span
                        class="ant-radio-button">1m</span></label>
                <label class="ant-radio-button-wrapper" id="w-5m"><span class="ant-radio-button">5m</span></label>
                <label class="ant-radio-button-wrapper" id="w-15m"><span class="ant-radio-button">15m</span></label>
            </div>
            <span class="ant-badge ant-badge-status-warning"><span class="ant-badge-status-dot"
                                                                   style="background:#eab308"></span><span
                    class="ant-badge-status-text">陈旧（示例）</span></span>
        </div>
    </div>

    <!-- 顶部 KPI + 迷你图 -->
    <div class="kpi-grid">
        <div class="ant-card mini">
            <div class="ant-card-body">
                <div class="ant-typography muted">人工智能 · 资金速度（近10min）</div>
                <svg viewBox="0 0 100 30">
                    <polyline fill="none" id="spark-ai" points="" stroke="#3b82f6" stroke-width="2"/>
                </svg>
                <div class="ant-statistic">
                    <div class="ant-statistic-title">当前速度</div>
                    <div class="ant-statistic-content"><span id="kpi-ai">-</span></div>
                </div>
            </div>
        </div>
        <div class="ant-card mini">
            <div class="ant-card-body">
                <div class="ant-typography muted">机器人 · 成交量柱（近10min）</div>
                <svg id="bar-robot" viewBox="0 0 100 30"></svg>
                <div class="ant-statistic">
                    <div class="ant-statistic-title">当前成交量</div>
                    <div class="ant-statistic-content"><span id="kpi-robot">-</span></div>
                </div>
            </div>
        </div>
        <div class="ant-card mini">
            <div class="ant-card-body">
                <div class="ant-typography muted">新能源车 · 净流入趋势（近10min）</div>
                <svg viewBox="0 0 100 30">
                    <polyline fill="none" id="spark-nev" points="" stroke="#10b981" stroke-width="2"/>
                </svg>
                <div class="ant-statistic">
                    <div class="ant-statistic-title">当前净流入</div>
                    <div class="ant-statistic-content"><span id="kpi-nev">-</span></div>
                </div>
            </div>
        </div>
    </div>

    <!-- 板块列表（带条形对比） -->
    <div class="ant-card" style="margin-top:12px">
        <div class="ant-card-body">
            <div class="title-row" style="margin-bottom:0">
                <div class="ant-typography muted">板块榜单（速度/净流入/加速度）</div>
                <div class="muted">单位：<span id="unitLabel">万</span></div>
            </div>
            <div class="board-list" id="boardList"></div>
        </div>
    </div>
</div>

<script>
    // 数据（概念板块示例）
    const dataset = [
        {
            board: '人工智能',
            inflow_speed: 6.5e7,
            inflow_net: 1.23e9,
            inflow_accel: 2.1e6,
            probing_ratio: .07,
            classification: 'multi_core'
        },
        {
            board: '机器人',
            inflow_speed: 4.2e7,
            inflow_net: 5.8e8,
            inflow_accel: 1.3e6,
            probing_ratio: .05,
            classification: 'mixed'
        },
        {
            board: '华为概念',
            inflow_speed: 2.9e7,
            inflow_net: 1.9e8,
            inflow_accel: 0.8e6,
            probing_ratio: .03,
            classification: 'single_core'
        },
        {
            board: '低空经济',
            inflow_speed: 3.6e7,
            inflow_net: 3.1e8,
            inflow_accel: 1.0e6,
            probing_ratio: .06,
            classification: 'multi_core'
        },
        {
            board: '光刻胶',
            inflow_speed: 1.9e7,
            inflow_net: 1.2e8,
            inflow_accel: 0.4e6,
            probing_ratio: .02,
            classification: 'mixed'
        },
        {
            board: '新能源车',
            inflow_speed: 5.1e7,
            inflow_net: 8.1e8,
            inflow_accel: 1.7e6,
            probing_ratio: .08,
            classification: 'multi_core'
        },
        {
            board: 'AI算力',
            inflow_speed: 1.2e7,
            inflow_net: 4.1e7,
            inflow_accel: 0.2e6,
            probing_ratio: .01,
            classification: 'single_core'
        },
        {
            board: '信创',
            inflow_speed: 3.3e7,
            inflow_net: 2.4e8,
            inflow_accel: 0.9e6,
            probing_ratio: .04,
            classification: 'mixed'
        }
    ];

    // 单位模式: 'wan' | 'yi' | 'raw'
    let unit = 'wan';
    const fmt = (n) => {
        if (unit === 'wan') return (n / 1e4).toFixed(2);
        if (unit === 'yi') return (n / 1e8).toFixed(2);
        return Number(n).toLocaleString('zh-CN');
    }
    const unitText = () => unit === 'wan' ? '万' : (unit === 'yi' ? '亿' : '原值');

    // 渲染板块列表（含 AntD 样式的 Progress 条形对比）
    function renderBoards() {
        const root = document.getElementById('boardList');
        root.innerHTML = '';
        const maxSpeed = Math.max(...dataset.map(d => d.inflow_speed));
        const maxNet = Math.max(...dataset.map(d => d.inflow_net));
        const maxAccel = Math.max(...dataset.map(d => d.inflow_accel));
        dataset.forEach(d => {
            const row = document.createElement('div');
            row.className = 'board-row';
            const tag = d.classification === 'single_core' ? '<span class="ant-tag" style="background:#2a0f2a;border-color:#5b184c;color:#f5c2e7">单核</span>' : (d.classification === 'multi_core' ? '<span class="ant-tag" style="background:#082a1b;border-color:#0d5131;color:#b2f5ea">多核</span>' : '<span class="ant-tag">混合</span>');
            row.innerHTML = `
          <div class="board-top">
            <span class="board-name">${d.board}</span>
            ${tag}
            <div class="meta muted">试盘 ${(d.probing_ratio * 100).toFixed(1)}%</div>
          </div>
          <div class="metrics">
            <div class="metric">
              <div class="label"><span>速度 (${unitText()})</span><span>${fmt(d.inflow_speed)}</span></div>
              <div class="ant-progress ant-progress-line ant-progress-status-normal ant-progress-show-info">
                <div class="ant-progress-outer">
                  <div class="ant-progress-inner">
                    <div class="ant-progress-bg" style="width:${(d.inflow_speed / maxSpeed) * 100}%;height:8px;background:linear-gradient(90deg,#3b82f6,#06b6d4);"></div>
                  </div>
                </div>
              </div>
            </div>
            <div class="metric">
              <div class="label"><span>净流入 (${unitText()})</span><span>${fmt(d.inflow_net)}</span></div>
              <div class="ant-progress ant-progress-line ant-progress-status-normal">
                <div class="ant-progress-outer"><div class="ant-progress-inner">
                  <div class="ant-progress-bg" style="width:${(d.inflow_net / maxNet) * 100}%;height:8px;background:linear-gradient(90deg,#16a34a,#84cc16);"></div>
                </div></div>
              </div>
            </div>
            <div class="metric">
              <div class="label"><span>加速度 (${unitText()})</span><span>${fmt(d.inflow_accel)}</span></div>
              <div class="ant-progress ant-progress-line ant-progress-status-normal">
                <div class="ant-progress-outer"><div class="ant-progress-inner">
                  <div class="ant-progress-bg" style="width:${(d.inflow_accel / maxAccel) * 100}%;height:8px;background:linear-gradient(90deg,#f59e0b,#f97316);"></div>
                </div></div>
              </div>
            </div>
          </div>
        `;
            root.appendChild(row);
        });
    }

    // 顶部迷你图（SVG），仅为风格演示
    function sparkPoints(arr) {
        const min = Math.min(...arr), max = Math.max(...arr);
        const span = Math.max(1e-9, max - min);
        return arr.map((v, i) => `${(i / (arr.length - 1)) * 100},${30 - ((v - min) / span) * 26}`).join(' ');
    }

    function drawMini() {
        const ai = [3.2, 3.8, 4.1, 3.9, 4.5, 5.0, 4.7, 5.4, 5.1, 5.6];
        const nev = [1.1, 1.3, 1.2, 1.6, 1.9, 1.7, 2.0, 2.2, 2.1, 2.4];
        document.getElementById('spark-ai').setAttribute('points', sparkPoints(ai));
        document.getElementById('spark-nev').setAttribute('points', sparkPoints(nev));
        // 柱状
        const robot = [8, 10, 7, 12, 15, 13, 11, 16, 18, 14];
        const svg = document.getElementById('bar-robot');
        svg.innerHTML = '';
        const max = Math.max(...robot);
        const bw = 7;
        const gap = 3;
        robot.forEach((v, i) => {
            const h = (v / max) * 26;
            const x = i * (bw + gap) + 2;
            const y = 28 - h;
            const rect = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
            rect.setAttribute('x', x);
            rect.setAttribute('y', y);
            rect.setAttribute('width', bw);
            rect.setAttribute('height', h);
            rect.setAttribute('fill', '#f59e0b');
            svg.appendChild(rect);
        });
        document.getElementById('kpi-ai').textContent = (ai[ai.length - 1]).toFixed(2);
        document.getElementById('kpi-robot').textContent = robot[robot.length - 1].toFixed(0);
        document.getElementById('kpi-nev').textContent = (nev[nev.length - 1]).toFixed(2);
    }

    // 单位切换
    function bindUnit() {
        const setCheck = (id, on) => {
            const el = document.getElementById(id);
            el.classList.toggle('ant-radio-button-wrapper-checked', !!on);
        };
        document.getElementById('u-wan').onclick = () => {
            unit = 'wan';
            setCheck('u-wan', 1);
            setCheck('u-yi', 0);
            setCheck('u-raw', 0);
            document.getElementById('unitLabel').textContent = '万';
            renderBoards();
        };
        document.getElementById('u-yi').onclick = () => {
            unit = 'yi';
            setCheck('u-wan', 0);
            setCheck('u-yi', 1);
            setCheck('u-raw', 0);
            document.getElementById('unitLabel').textContent = '亿';
            renderBoards();
        };
        document.getElementById('u-raw').onclick = () => {
            unit = 'raw';
            setCheck('u-wan', 0);
            setCheck('u-yi', 0);
            setCheck('u-raw', 1);
            document.getElementById('unitLabel').textContent = '原值';
            renderBoards();
        };
    }

    drawMini();
    bindUnit();
    renderBoards();
</script>
</body>
</html>
