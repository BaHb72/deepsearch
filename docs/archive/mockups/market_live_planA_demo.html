<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>Market Live（方案A）样式预览</title>
    <style>
        :root {
            --bg: #0f1115;
            --panel: #151923;
            --panel-2: #121621;
            --text: #e8ecf1;
            --muted: #98a2b3;
            --accent: #3b82f6;
            --danger: #ef4444;
            --warn: #eab308;
            --ok: #10b981;
            --chip: #222839;
            --grid-gap: 12px;
            --radius: 10px;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, Helvetica, Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--bg);
            color: var(--text);
        }

        .container {
            padding: 16px;
            display: grid;
            grid-template-rows: auto 1fr;
            row-gap: var(--grid-gap);
            height: 100vh;
        }

        /* 顶部状态条 */
        .status-bar {
            background: linear-gradient(180deg, #151a24 0%, #10131b 100%);
            border: 1px solid #1f2636;
            border-radius: var(--radius);
            padding: 12px 14px;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            align-items: center;
        }

        .title {
            font-weight: 600;
            margin-right: 8px;
        }

        .badge {
            padding: 4px 10px;
            border-radius: 999px;
            font-size: 12px;
            letter-spacing: .2px;
            background: var(--chip);
            border: 1px solid #2a3347;
            color: var(--muted);
        }

        .badge.ok {
            color: #b2f5ea;
            border-color: #134e4a;
            background: #0b2f2d;
        }

        .badge.stale {
            color: #fde68a;
            border-color: #7c5b00;
            background: #2a2105;
        }

        .badge.warn {
            color: #fde68a;
            border-color: #7c5b00;
            background: #2a2105;
        }

        .badge.accent {
            color: #bfdbfe;
            border-color: #1d4ed8;
            background: #0b1533;
        }

        .spacer {
            flex: 1;
        }

        .btn {
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid #2a3347;
            background: #111827;
            color: var(--text);
            cursor: pointer;
        }

        .btn:hover {
            filter: brightness(1.15);
        }

        /* 主体布局 */
        .main {
            display: grid;
            grid-template-columns: 2.1fr 1.4fr;
            gap: var(--grid-gap);
            min-height: 0;
        }

        .panel {
            background: var(--panel);
            border: 1px solid #1f2636;
            border-radius: var(--radius);
            padding: 12px;
            min-height: 0;
        }

        .panel h3 {
            margin: 0 0 10px;
            font-size: 15px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .subtle {
            color: var(--muted);
            font-size: 12px;
        }

        /* 热力图 */
        .heatmap {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 8px;
        }

        .tile {
            border-radius: 8px;
            padding: 8px;
            min-height: 64px;
            position: relative;
            border: 1px solid #263049;
            background: #0e1220;
        }

        .tile strong {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
        }

        .tile small {
            color: var(--muted);
            font-size: 11px;
        }

        .tile .metric {
            position: absolute;
            right: 8px;
            bottom: 8px;
            font-weight: 600;
        }

        .scale-0 {
            background: #0f172a;
        }

        .scale-1 {
            background: #0b1a2e;
        }

        .scale-2 {
            background: #0b223e;
        }

        .scale-3 {
            background: #0b2a4e;
        }

        .scale-4 {
            background: #0b335f;
        }

        .scale-5 {
            background: #0b3b6f;
        }

        .scale-6 {
            background: #0b437f;
        }

        .scale-7 {
            background: #0b538f;
        }

        .scale-8 {
            background: #0b5b9f;
        }

        .scale-9 {
            background: #0b63af;
        }

        /* 榜单 */
        .table {
            width: 100%;
            border-collapse: collapse;
        }

        .table th, .table td {
            padding: 8px;
            border-bottom: 1px solid #1f2636;
            font-size: 13px;
            text-align: left;
        }

        .table th {
            color: #9fb0c4;
            font-weight: 500;
        }

        .tag {
            padding: 2px 6px;
            font-size: 11px;
            border-radius: 6px;
            background: #1b2435;
            border: 1px solid #2a3347;
            color: #cbd5e1;
        }

        .tag.single {
            background: #2a0f2a;
            border-color: #5b184c;
            color: #f5c2e7;
        }

        .tag.multi {
            background: #082a1b;
            border-color: #0d5131;
            color: #b2f5ea;
        }

        /* 详情 */
        .grid-2 {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: var(--grid-gap);
        }

        .bar {
            height: 10px;
            border-radius: 999px;
            background: #1f2937;
            overflow: hidden;
        }

        .bar > span {
            display: block;
            height: 100%;
            background: linear-gradient(90deg, #3b82f6, #06b6d4);
        }

        .list {
            display: grid;
            gap: 8px;
        }

        .row {
            display: grid;
            grid-template-columns: 1fr 80px 80px 80px;
            gap: 8px;
            align-items: center;
            padding: 8px;
            border: 1px solid #1f2636;
            background: var(--panel-2);
            border-radius: 8px;
        }

        .mono {
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="status-bar" id="statusBar">
        <div class="title">市场实时 · 方案A</div>
        <span class="badge accent" id="phase">连续竞价</span>
        <span class="badge" id="asOf">asOf: 14:57:00</span>
        <span class="badge" id="retrievedAt">更新: 14:57:03</span>
        <span class="badge" id="source">数据源: amazingdata</span>
        <span class="badge stale" id="staleFlag" style="display:none;">陈旧</span>
        <div class="spacer"></div>
        <button class="btn" onclick="toggleStale()">切换陈旧标识</button>
    </div>

    <div class="main">
        <!-- 左侧：热力 + 详情 -->
        <div class="panel">
            <h3>板块热力（按资金速度） <span class="subtle">window=1m</span></h3>
            <div class="heatmap" id="heatmap"></div>
            <div style="height:12px"></div>
            <div class="grid-2">
                <div class="panel" style="padding:12px">
                    <h3>板块详情 · 人工智能 <span class="tag multi">多核</span></h3>
                    <div class="subtle" style="margin:6px 0 12px">Top5 贡献（按资金速度）</div>
                    <div class="list" id="drivers"></div>
                </div>
                <div class="panel" style="padding:12px">
                    <h3>试盘列表 · 主板 <span class="subtle">（近1分钟）</span></h3>
                    <div class="list" id="probing"></div>
                </div>
            </div>
        </div>

        <!-- 右侧：榜单 -->
        <div class="panel">
            <h3>板块榜单（速度/净流入/加速度/试盘占比）</h3>
            <table class="table" id="ranking">
                <thead>
                <tr>
                    <th>板块</th>
                    <th class="mono">速度</th>
                    <th class="mono">净流入</th>
                    <th class="mono">加速度</th>
                    <th>试盘占比</th>
                    <th>驱动</th>
                </tr>
                </thead>
                <tbody></tbody>
            </table>
        </div>
    </div>
</div>

<script>
    // Mock 数据（与规划的接口字段对齐）
    const overview = [
        {
            board: '人工智能',
            inflow_speed: 6.5e7,
            inflow_net: 1.23e9,
            inflow_accel: 2.1e6,
            probing_ratio: .07,
            breadth_up_ratio: .58,
            top1_contrib_pct: .22,
            top3_contrib_pct: .45,
            hhi: .19,
            classification: 'multi_core'
        },
        {
            board: '机器人',
            inflow_speed: 4.2e7,
            inflow_net: 5.8e8,
            inflow_accel: 1.3e6,
            probing_ratio: .05,
            breadth_up_ratio: .51,
            top1_contrib_pct: .33,
            top3_contrib_pct: .52,
            hhi: .23,
            classification: 'mixed'
        },
        {
            board: '华为概念',
            inflow_speed: 2.9e7,
            inflow_net: 1.9e8,
            inflow_accel: 0.8e6,
            probing_ratio: .03,
            breadth_up_ratio: .48,
            top1_contrib_pct: .42,
            top3_contrib_pct: .66,
            hhi: .29,
            classification: 'single_core'
        },
        {
            board: '低空经济',
            inflow_speed: 3.6e7,
            inflow_net: 3.1e8,
            inflow_accel: 1.0e6,
            probing_ratio: .06,
            breadth_up_ratio: .62,
            top1_contrib_pct: .30,
            top3_contrib_pct: .55,
            hhi: .22,
            classification: 'multi_core'
        },
        {
            board: '光刻胶',
            inflow_speed: 1.9e7,
            inflow_net: 1.2e8,
            inflow_accel: 0.4e6,
            probing_ratio: .02,
            breadth_up_ratio: .41,
            top1_contrib_pct: .28,
            top3_contrib_pct: .47,
            hhi: .18,
            classification: 'mixed'
        },
        {
            board: '新能源车',
            inflow_speed: 5.1e7,
            inflow_net: 8.1e8,
            inflow_accel: 1.7e6,
            probing_ratio: .08,
            breadth_up_ratio: .68,
            top1_contrib_pct: .18,
            top3_contrib_pct: .41,
            hhi: .15,
            classification: 'multi_core'
        },
        {
            board: 'AI算力',
            inflow_speed: 1.2e7,
            inflow_net: 4.1e7,
            inflow_accel: 0.2e6,
            probing_ratio: .01,
            breadth_up_ratio: .36,
            top1_contrib_pct: .39,
            top3_contrib_pct: .62,
            hhi: .27,
            classification: 'single_core'
        },
        {
            board: '信创',
            inflow_speed: 3.3e7,
            inflow_net: 2.4e8,
            inflow_accel: 0.9e6,
            probing_ratio: .04,
            breadth_up_ratio: .53,
            top1_contrib_pct: .26,
            top3_contrib_pct: .49,
            hhi: .20,
            classification: 'mixed'
        }
    ];

    const drivers = [
        {code: '600000.SH', name: '浦发银行', contrib_pct: 0.18, speed: 4.1e6, accel: 1.2e5, leader: true},
        {code: '600519.SH', name: '贵州茅台', contrib_pct: 0.12, speed: 2.1e6, accel: 0.6e5, leader: false},
        {code: '600036.SH', name: '招商银行', contrib_pct: 0.10, speed: 1.9e6, accel: 0.5e5, leader: false},
        {code: '601318.SH', name: '中国平安', contrib_pct: 0.08, speed: 1.3e6, accel: 0.3e5, leader: false},
        {code: '601688.SH', name: '华泰证券', contrib_pct: 0.06, speed: 0.8e6, accel: 0.2e5, leader: false}
    ];

    const probing = [
        {
            code: '000001.SZ',
            name: '平安银行',
            obi: 0.68,
            speed: 3.2e6,
            accel: 0.8e5,
            reason: ['OBI>=0.6', 'speed>=3e6']
        },
        {code: '600016.SH', name: '民生银行', obi: 0.61, speed: 2.7e6, accel: 0.6e5, reason: ['OBI>=0.6']}
    ];

    const fmt = n => {
        if (Math.abs(n) >= 1e9) return (n / 1e9).toFixed(2) + "十亿";
        if (Math.abs(n) >= 1e8) return (n / 1e8).toFixed(2) + "亿";
        if (Math.abs(n) >= 1e6) return (n / 1e6).toFixed(2) + "百万";
        if (Math.abs(n) >= 1e4) return (n / 1e4).toFixed(2) + "万";
        return n.toFixed(0);
    }

    function renderHeatmap() {
        const root = document.getElementById('heatmap');
        root.innerHTML = '';
        const speeds = overview.map(o => o.inflow_speed);
        const max = Math.max(...speeds);
        overview.forEach(o => {
            const pct = max ? o.inflow_speed / max : 0;
            const scale = Math.min(9, Math.max(0, Math.round(pct * 9)));
            const el = document.createElement('div');
            el.className = `tile scale-${scale}`;
            el.innerHTML = `<strong>${o.board}</strong>
          <small>净流入 ${fmt(o.inflow_net)} · 试盘 ${(o.probing_ratio * 100).toFixed(1)}%</small>
          <div class="metric mono">${fmt(o.inflow_speed)}</div>`;
            root.appendChild(el);
        });
    }

    function renderRanking() {
        const tbody = document.querySelector('#ranking tbody');
        tbody.innerHTML = '';
        overview
            .slice()
            .sort((a, b) => b.inflow_speed - a.inflow_speed)
            .forEach(o => {
                const tr = document.createElement('tr');
                const tag = o.classification === 'single_core' ? '<span class="tag single">单核</span>' : (o.classification === 'multi_core' ? '<span class="tag multi">多核</span>' : '<span class="tag">混合</span>');
                tr.innerHTML = `<td>${o.board}</td>
                          <td class="mono">${fmt(o.inflow_speed)}</td>
                          <td class="mono">${fmt(o.inflow_net)}</td>
                          <td class="mono">${fmt(o.inflow_accel)}</td>
                          <td>${(o.probing_ratio * 100).toFixed(1)}%</td>
                          <td>${tag}</td>`;
                tbody.appendChild(tr);
            });
    }

    function renderDrivers() {
        const root = document.getElementById('drivers');
        root.innerHTML = '';
        drivers.forEach(d => {
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `<div><strong>${d.name}</strong> <span class="subtle mono">${d.code}</span></div>
                         <div class="mono">${(d.contrib_pct * 100).toFixed(1)}%</div>
                         <div class="mono">${fmt(d.speed)}</div>
                         <div class="mono">${fmt(d.accel)}</div>`;
            const bar = document.createElement('div');
            bar.className = 'bar';
            const barInner = document.createElement('span');
            barInner.style.width = Math.min(100, d.contrib_pct * 100) + '%';
            bar.appendChild(barInner);
            row.appendChild(bar);
            root.appendChild(row);
        });
    }

    function renderProbing() {
        const root = document.getElementById('probing');
        root.innerHTML = '';
        probing.forEach(p => {
            const row = document.createElement('div');
            row.className = 'row';
            row.innerHTML = `<div><strong>${p.name}</strong> <span class="subtle mono">${p.code}</span></div>
                         <div class="mono">OBI ${(p.obi * 100).toFixed(0)}%</div>
                         <div class="mono">速 ${fmt(p.speed)}</div>
                         <div class="mono">加 ${fmt(p.accel)}</div>`;
            root.appendChild(row);
        });
    }

    function toggleStale() {
        const stale = document.getElementById('staleFlag');
        stale.style.display = stale.style.display === 'none' ? 'inline-block' : 'none';
    }

    renderHeatmap();
    renderRanking();
    renderDrivers();
    renderProbing();
</script>
</body>
</html>
